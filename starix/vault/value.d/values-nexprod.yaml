---
server:

  ingress:
    enabled: false
    activeService: true
    ingressClassName: "haproxy"
    hosts: 
    - host: "vault.nexdev.net"
      paths: []

  resources: {}
    # limits:
    #   memory: 4Gi

  dataStorage:
    enabled: true
    size: 10Gi
    mountPath: "/vault/data"
    storageClass: longhorn-stricted

  auditStorage:
    enabled: false


  # Run Vault in "HA" mode.
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true

      config: |
        ui = true
        cluster_name = "vault-integrated-storage"
        default_max_request_duration = "7200s"
        
        listener "tcp" {
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_disable = 1
          # Enable unauthenticated metrics access (necessary for Prometheus Operator)
          telemetry {
            unauthenticated_metrics_access = "true"
          }
          # tls_cert_file = "/vault/userconfig/tls-server/fullchain.pem"
          # tls_key_file = "/vault/userconfig/tls-server/server.key"
          # tls_client_ca_file = "/vault/userconfig/tls-server/client-auth-ca.pem"
        }

        seal "awskms" {
          region     = "ap-east-1"
          kms_key_id = "7ba20a15-eac9-4f9d-9319-471a377ac8ca"
        }

        telemetry {
          prometheus_retention_time = "24h",
          disable_hostname = true
        }

        storage "raft" {
          path = "/vault/data"
            retry_join {
            leader_api_addr = "http://vault-nexprod-0.vault-nexprod-internal:8200"
            # leader_ca_cert_file = "/vault/userconfig/tls-ca/ca.crt"
            # leader_client_cert_file = "/vault/userconfig/tls-server/server.crt"
            # leader_client_key_file = "/vault/userconfig/tls-server/server.key"
          }
          retry_join {
            leader_api_addr = "http://vault-nexprod-1.vault-nexprod-internal:8200"
            # leader_ca_cert_file = "/vault/userconfig/tls-ca/ca.crt"
            # leader_client_cert_file = "/vault/userconfig/tls-server/server.crt"
            # leader_client_key_file = "/vault/userconfig/tls-server/server.key"
          }
          retry_join {
            leader_api_addr = "http://vault-nexprod-2.vault-nexprod-internal:8200"
            # leader_ca_cert_file = "/vault/userconfig/tls-ca/ca.crt"
            # leader_client_cert_file = "/vault/userconfig/tls-server/server.crt"
            # leader_client_key_file = "/vault/userconfig/tls-server/server.key"
          }

        }

        service_registration "kubernetes" {}

  serviceAccount:
    createSecret: true
  
  readinessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
  livenessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true"
    initialDelaySeconds: 60

  updateStrategyType: "RollingUpdate"

  extraSecretEnvironmentVars:
  - envName: AWS_ACCESS_KEY_ID
    secretName: eks-creds
    secretKey: AWS_ACCESS_KEY_ID
  - envName: AWS_SECRET_ACCESS_KEY
    secretName: eks-creds
    secretKey: AWS_SECRET_ACCESS_KEY

  standalone:
    enabled: false

  tolerations:
  - key: devops/node-role
    operator: Equal
    effect: NoSchedule
    value: vault

  nodeSelector:
    vault-workload: "yes"

ui:
  enabled: true
  externalPort: 8200
  targetPort: 8200
  activeVaultPodOnly: false
  serviceType: "ClusterIP"