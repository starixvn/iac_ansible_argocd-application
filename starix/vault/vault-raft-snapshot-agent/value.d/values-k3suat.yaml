---
cronjob:
  schedule: "15 17 * * *"
  env:
  - name: TZ
    value: Asia/Bangkok
  - name: retainDay
    value: "3"
  - name: S3_HOST
    value: https://minio-api.starixsoft.com
  - name: S3_BUCKET
    value: vault-backup
  - name: S3_PATH
    value: vault-backup/starix/uat/
  - name: VAULT_ROLE
    value: vault-snapshot
  - name: VAULT_ADDR
    value: http://vault-starix-k3suat-active:8200
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        key: AWS_SECRET_ACCESS_KEY
        name: vault-snapshot-credentials
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        key: AWS_ACCESS_KEY_ID
        name: vault-snapshot-credentials
  - name: http_proxy
    value: lisasqd.nebula.prod:8801
  - name: https_proxy
    value: lisasqd.nebula.prod:8801
  - name: no_proxy
    value: vault-starix-k3suat-active:8200

  - name: ALERT_GROUP_ID
    value: 19:5cf103014bf348b4a214935d021d09f3@thread.tacv2
