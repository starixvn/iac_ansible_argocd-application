---
controller:
  replicaCount: 3

  # podAnnotations:
  #   vault.hashicorp.com/agent-inject: 'true'
  #   vault.hashicorp.com/role: 'cert-injector'
  #   vault.hashicorp.com/agent-inject-secret-config.txt: 'nexops/certs'

  config:
    # ssl-certificate: "haproxy-ingress/nebula-cert"
    timeout-connect: "5s"
    scale-server-slots: "7"
    maxconn: "20000"
    forwarded-for: "true"
    dontlognull: "true"
    stats-config-snippet: |
      stats auth nexops:NexOps!QAZ
      stats refresh 300s
      stats show-legends
      stats show-node
      stats show-modules

  # nodeSelector:
  #   haproxy: "yes"

  extraArgs:
  - --disable-ipv6
  - --configmap-tcp-services=haproxy-ingress/tcp-configmap

  logging:
    level: info
    traffic:
      address: "stdout"
      format: "raw"
      facility: "daemon"
  
  service:
    externalTrafficPolicy: "Local"
    type: LoadBalancer
    # tcpPorts:
    # - name: logstash
    #   port: 15044
    #   targetPort: 15044
    #   protocol: TCP

  serviceMonitor:
    enabled: true
    extraLabels: {}
    endpoints:
      - port: stat
        path: /metrics
        scheme: http
        interval: 30s
      - port: http
        path: /metrics
        scheme: http
        interval: 30s

  


