---
clusterDomain: testlab.local

operator:
  enabled: true

prometheus:
  service:
    type: NodePort
    ports:
      http: 9090
    nodePorts:
      http: "30062"

  retention: 1d
  retentionSize: "2GB"

  persistence:
    enabled: false
    storageClass: "longhorn"
    size: 5Gi

  resourcesPreset: "large"

  additionalScrapeConfigs:
    enabled: false
    type: external
    external:
      ## Name of the secret that Prometheus should use for the additional scrape configuration
      name: ""
      ## Name of the key inside the secret to be used for the additional scrape configuration.
      key: ""
    internal:
      jobList: []
  ##
  additionalScrapeConfigsExternal:
    enabled: false
    name: ""
    key: ""

  additionalPrometheusRules:
  - name: opensearch.rules
    groups:
    - name: opensearch.rules
      rules:

      # Opensearch disk out of space 
      - alert: OpensearchDiskOutOfSpace
        expr: opensearch_fs_total_available_bytes / opensearch_fs_total_total_bytes * 100 < 10
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Opensearch disk out of space (instance {{ $labels.pod }})
          description: "The disk usage is over 90%\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
        
      #  Opensearch Node Offline
      - alert: OpensearchNodeOffline
        expr: max_over_time(opensearch_cluster_nodes_number[5m]) < max_over_time(opensearch_cluster_nodes_number[1d:5m])
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Opensearch node goes offline (instance {{ $labels.pod }})
          description: "Some node go offline!\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      # Opensearch Cluster Red 
      - alert: OpensearchClusterRed
        expr: opensearch_cluster_status == 2
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Opensearch Cluster Red (instance {{ $labels.pod }})
          description: "Opensearch Cluster Red status\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      # Opensearch Cluster Yellow 
      - alert: OpensearchClusterYellow
        expr: opensearch_cluster_status == 1
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Opensearch Cluster Yellow (instance {{ $labels.pod }})
          description: "Elastic Cluster Yellow status\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      #  Opensearch no new documents 
      - alert: OpensearchNoNewDocuments
        expr: increase(opensearch_indices_indexing_index_count{job="ops-cluster-nodes-hot"}[1m]) < 1
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Opensearch no new documents (instance {{ $labels.pod }})
          description: "No new documents for 1 min!\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

    
alertmanager:
  enabled: true

  service:
    type: NodePort

  config:
    global:
      resolve_timeout: 15m
    receivers:
    - name: devnull
    - name: 'prometheus-msteams-warning'
      webhook_configs:
        - send_resolved: true
          url: 'http://prometheus-msteams:2000/alertmanager-warning'
    - name: 'prometheus-msteams-critical'
      webhook_configs:
        - send_resolved: true
          url: 'http://prometheus-msteams:2000/alertmanager-critical' 
    route:
      group_by: ['alerts-msteams']
      group_interval: 1m
      group_wait: 1m
      repeat_interval: 1440m
      receiver: devnull
      routes:
        - receiver: prometheus-msteams-warning
          match:
            severity: warning
        - receiver: prometheus-msteams-critical
          match:
            severity: critical