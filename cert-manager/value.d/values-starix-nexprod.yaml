---
crds:
  enabled: true

replicaCount: 1
dns01RecursiveNameservers: ""

# deploymentAnnotations:
#   certmanager.k8s.io/disable-validation: "true"

# Nexops vars for extra Object setup
route53RoleArn: "arn:aws:iam::584102114761:role/lumi-cert-challenger"


extraObjects:
- | ## Vault Authentication
  apiVersion: secrets.hashicorp.com/v1beta1
  kind: VaultAuth
  metadata:
    name: {{ include "cert-manager.fullname" . }}
    namespace: {{ include "cert-manager.namespace" . }}
  spec:
    method: kubernetes
    mount: kubernetes
    kubernetes:
      role: aws-local-cert-challenger
      serviceAccount: {{ template "cert-manager.serviceAccountName" . }}
      audiences:
        - vault
- | ## Vault Static Secret Injector
  apiVersion: secrets.hashicorp.com/v1beta1
  kind: VaultStaticSecret
  metadata:
    name: {{ include "cert-manager.fullname" . }}-aws-creds
    namespace: {{ include "cert-manager.namespace" . }}
  spec:
    type: kv-v2
    mount: nexops
    path: cloud/aws/local/cert-challenger

    destination:
      name: {{ include "cert-manager.fullname" . }}-aws-creds
      create: true
      type: Opaque
      transformation:
        excludeRaw: true

    # static secret refresh interval
    refreshAfter: 24h

    # Name of the CRD to authenticate to Vault
    vaultAuthRef: {{ include "cert-manager.fullname" . }}

- | ## Issuer Route53 - lumigame.com - Z10169222Q6V6IPOEWWTI
  apiVersion: cert-manager.io/v1
  kind: Issuer
  metadata:
    name: {{ include "cert-manager.fullname" . }}-aws-lumigame-com
    namespace: {{ include "cert-manager.namespace" . }}
  spec:
    acme:
      server: https://acme-v02.api.letsencrypt.org/directory
      email: nexops@starixsoft.com
      privateKeySecretRef:
        name: {{ include "cert-manager.fullname" . }}-aws-lumigame-com
      solvers:
      - selector: {}
          # dnsZones:
          #   - "nex.info.vn"
        dns01:
          route53:
            hostedZoneID: Z10169222Q6V6IPOEWWTI
            region: ap-east-1
            accessKeyIDSecretRef:
              name: {{ include "cert-manager.fullname" . }}-aws-creds
              key: access-key-id
            secretAccessKeySecretRef:
              name: {{ include "cert-manager.fullname" . }}-aws-creds
              key: secret-access-key
            role: {{ .Values.route53RoleArn }}

- | ## Certificate - *.lumigame.com
  apiVersion: cert-manager.io/v1
  kind: Certificate
  metadata:
    # name: wildcard-nex-info-vn
    name: {{ include "cert-manager.name" . }}-lumigame-com
    namespace: {{ include "cert-manager.namespace" . }}
  spec:
    # secretName: wildcard-nex-info-vn
    secretName: lumigame-com
    dnsNames:
    - '*.lumigame.com'
    duration: 1920h
    renewBefore: 24h
    issuerRef:
      name: {{ include "cert-manager.fullname" . }}-aws-lumigame-com
      kind: Issuer