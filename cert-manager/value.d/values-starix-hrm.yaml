---
crds:
  enabled: true

replicaCount: 1



extraObjects:
- |
  apiVersion: cert-manager.io/v1
  kind: ClusterIssuer
  metadata:
    name: letsencrypt-prod
  spec:
    acme:
      email: nexops@starixsoft.com
      server: https://acme-v02.api.letsencrypt.org/directory
      privateKeySecretRef:
        name: letsencrypt-prod-issuer-account-key
      solvers:
        - http01:
            ingress:
              serviceType: ClusterIP
              ingressClassName: haproxy

# For public domain only  - hrm-lexfin.nexdev.net &&  hrm-slk.nexdev.net
- |
  apiVersion: cert-manager.io/v1
  kind: Certificate
  metadata:
    name:  nexdev-lexfin-cert-le
    namespace: hrm
  spec:
    commonName: hrm-slk.nexdev.net
    secretName:  nexdev-lexfin-cert-le
    dnsNames:
      - hrm-lexfin.nexdev.net
      - hrm-slk.nexdev.net
      - go.nexdev.net
      - hrm-nextfortune.nexdev.net
      - hrm-ascentis.nexdev.net
      - hrm-onelab.nexdev.net
      - hrm-oseas.nexdev.net
      - hrm-fts.nexdev.net
      - hrm-acora.nexdev.net
      - hrm-hyjay.nexdev.net
      - hrm-ssi.nexdev.net
      - hrm-emc.nexdev.net
      - hrm-bpo.nexdev.net
      - hrm-letstalk.nexdev.net
      - hrm-digibytesky.nexdev.net
      - hrm-evo.nexdev.net
      - hrm-new.nexdev.net
      - hrm-new-nexvision.nexdev.net
      - hrm.nexdev.net
      - hrm-nexvision.nexdev.net
      - hrm-letstalk-api.nexdev.net
      - hrm-ntx.nexdev.net
    duration: 2160h
    renewBefore: 96h
    issuerRef:
      kind: ClusterIssuer
      name: letsencrypt-prod

