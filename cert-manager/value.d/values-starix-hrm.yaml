---
crds:
  enabled: true

replicaCount: 1



extraObjects:
- |
  apiVersion: cert-manager.io/v1
  kind: ClusterIssuer
  metadata:
    name: letsencrypt-prod
  spec:
    acme:
      email: nexops@starixsoft.com
      server: https://acme-v02.api.letsencrypt.org/directory
      privateKeySecretRef:
        name: letsencrypt-prod-issuer-account-key
      solvers:
        - http01:
            ingress:
              serviceType: ClusterIP
              ingressClassName: haproxy

# For public domain only  - hrm-lexfin.nexdev.net &&  hrm-slk.nexdev.net
- |
  apiVersion: cert-manager.io/v1
  kind: Certificate
  metadata:
    name:  nexdev-lexfin-cert-le
    namespace: hrm
  spec:
    commonName: hrm-slk.nexdev.net
    secretName:  nexdev-lexfin-cert-le
    dnsNames:
      - hrm-lexfin.nexdev.net
      - hrm-slk.nexdev.net
    duration: 2160h
    renewBefore: 96h
    issuerRef:
      kind: ClusterIssuer
      name: letsencrypt-prod

# For public domain only  - hrm.comtechsb.com &&  hrm-new.comtechsb.com
- |
  apiVersion: cert-manager.io/v1
  kind: Certificate
  metadata:
    name: comtechsb-cert-le
    namespace: hrm
  spec:
    commonName: hrm.comtechsb.com
    secretName:  comtechsb-cert-le
    dnsNames:
      - hrm.comtechsb.com
      - hrm-new.comtechsb.com
    duration: 2160h
    renewBefore: 96h
    issuerRef:
      kind: ClusterIssuer
      name: letsencrypt-prod