---
controller:
  replicas: 1

manager:
  kubernetesClusterDomain: starix.nexprod

metricsService:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: https
  type: ClusterIP

defaultVaultConnection:
  enabled: true
  address: "http://vault-starix-nexprod-active:8200"
  skipTLSVerify: true
