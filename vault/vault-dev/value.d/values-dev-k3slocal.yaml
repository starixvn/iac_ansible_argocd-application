---
server:

  ingress:
    activeService: true
    ingressClassName: "haproxy"
    enabled: false
    hosts: 
    - host: "vault-dev.nexdev.net"
      paths: []

  resources: {}

  dataStorage:
    enabled: true
    size: 5Gi
    mountPath: "/vault/data"
    storageClass: longhorn

  auditStorage:
    enabled: false

  standalone:
    enabled: "true"
    config: |
      ui = true
      default_max_request_duration = "7200s"

      listener "tcp" {
        tls_disable = 1
        address = "0.0.0.0:8200"
        cluster_address = "0.0.0.0:8201"
        x_forwarded_for_authorized_addrs = ["10.42.0.0/16"]
        telemetry {
          unauthenticated_metrics_access = "true"
        }
      }
      storage "raft" {
        path = "/vault/data"
      }

      telemetry {
        prometheus_retention_time = "24h",
        disable_hostname = true
      }

  # Run Vault in "HA" mode.
  ha:
    enabled: false

  serviceAccount:
    createSecret: true

  readinessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
  livenessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true"
    initialDelaySeconds: 60

  updateStrategyType: "RollingUpdate"

  extraEnvironmentVars:
    VAULT_RAFT_NODE_ID: "vault-dev-k3slocal-0"


ui:
  enabled: true
  externalPort: 8200
  targetPort: 8200
  activeVaultPodOnly: false
  serviceType: "ClusterIP"

serverTelemetry:
  serviceMonitor:
    enabled: true