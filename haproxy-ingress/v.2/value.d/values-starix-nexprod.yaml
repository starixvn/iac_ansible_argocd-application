---
controller:
  config:
    ssl-certificate: "haproxy-ingress/nexdev-crt"
    stats-config-snippet: |
      stats auth nexops:NexOps!QAZ
      stats refresh 300s
      stats show-legends
      stats show-node
      stats show-modules
  
  extraArgs:
  - --configmap-tcp-services=haproxy-ingress/tcp-configmap

  service:
    type: LoadBalancer
    externalTrafficPolicy: "Local"
    # tcpPorts:
    # - name: logstash
    #   port: 5044
    #   targetPort: 5044
    #   protocol: TCP

  logging:
    level: info
    traffic:
      address: "logstash-nexprod-logstash.logging.svc"
      port: "5045"
      format: "rfc3164"
      facility: "local1"

  nodeSelector:
    node-role.kubernetes.io/master: "true"
    node-role.kubernetes.io/control-plane: "true"

  serviceMonitor:
    enabled: true
    extraLabels: {}
    endpoints:
      - port: stat
        path: /metrics
        scheme: http
        interval: 30s


