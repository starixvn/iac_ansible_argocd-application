---
controller:
  
  config:
    ssl-certificate: "haproxy-ingress/lumigame-cert"
    stats-config-snippet: |
      stats auth nexops:NexOps!QAZ
      stats refresh 300s
      stats show-legends
      stats show-node
      stats show-modules
    frontend-config-snippet: |
      capture request header Host len 30
      capture request header User-Agent len 200
      capture request header Referer len 800
      capture request header X-Forwarded-For len 20
    backend-config-snippet: |
      option forwardfor if-none

  extraArgs:
  - --configmap-tcp-services=gitlab-server/gitlab-server-haproxy-tcp

  service:
    type: LoadBalancer
    tcpPorts:
    - name: ssh
      port: 22
      targetPort: 22
    - name: sftp
      port: 8022
      targetPort: 8022

  logging:
    level: info
    traffic:
      address: "logstash-lumprod-logstash.logging.svc"
      port: "5045"
      format: "rfc3164"
      facility: "local1"

  nodeSelector:
    node-role.kubernetes.io/master: "true"
    node-role.kubernetes.io/control-plane: "true"

  serviceMonitor:
    enabled: true
    extraLabels: {}
    endpoints:
      - port: stat
        path: /metrics
        scheme: http
        interval: 30s

extraResources:
- |
  apiVersion: v1
  kind: Secret
  type: kubernetes.io/tls
  metadata:
    name: starixsoft-cert
    namespace: haproxy-ingress
  data:
    tls.crt: 
    tls.key: 
- |
  apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: dummy-load-starixsoft-cert
    namespace: haproxy-ingress
  spec:
    ingressClassName: haproxy
    tls:
    - hosts:
      - "*.starixsoft.com"
      secretName: starixsoft-cert
    rules:
    - host: "*.starixsoft.com"
