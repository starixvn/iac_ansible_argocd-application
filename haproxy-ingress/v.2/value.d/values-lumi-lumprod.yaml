---
controller:
  kind: DaemonSet
  config:
    ssl-certificate: "haproxy-ingress/lumigame-cert"
    stats-config-snippet: |
      stats auth nexops:NexOps!QAZ
      stats refresh 300s
      stats show-legends
      stats show-node
      stats show-modules
    frontend-config-snippet: |
      capture request header Host len 30
      capture request header User-Agent len 200
      capture request header Referer len 800
      capture request header X-Forwarded-For len 20
    backend-config-snippet: |
      option forwardfor if-none

  extraArgs:
  - --disable-ipv6
  - --configmap-tcp-services=gitlab-server/gitlab-server-haproxy-tcp

  service:
    type: LoadBalancer
    externalTrafficPolicy: "Local"
    ipFamilyPolicy: SingleStack
    ipFamilies: [IPv4]
    tcpPorts:
    - name: ssh
      port: 22
      targetPort: 22
    - name: sftp
      port: 8022
      targetPort: 8022

  logging:
    level: info
    traffic:
      address: "logstash-lumprod-logstash.logging.svc"
      port: "5045"
      format: "rfc3164"
      facility: "local1"

  nodeSelector:
    node-role.kubernetes.io/master: "true"
    node-role.kubernetes.io/control-plane: "true"

  serviceMonitor:
    enabled: true
    extraLabels: {}
    endpoints:
      - port: stat
        path: /metrics
        scheme: http
        interval: 30s


defaultBackend:
  image: "hub.lumigame.com/base/nexops-tools/default-backend-ingress"

extraResources:
##############################
## DEFAULT BACKEND CONF
##############################
- |
  apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: be-default-{{ .Release.Name }}
    namespace: {{ include "kubernetes-ingress.namespace" . }}
  spec:
    ingressClassName: {{ .Values.controller.ingressClassResource.name }}
    defaultBackend:
      service:
        name: be-default-{{ .Release.Name }}
        port:
          number: 80
- |
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: be-default-{{ .Release.Name }}
    namespace: {{ include "kubernetes-ingress.namespace" . }}
  spec:
    replicas: 2
    selector:
      matchLabels:
        app: nexops
    template:
      metadata:
        labels:
          app: nexops
      spec:
        containers:
        - name: nexops
          image: {{ .Values.defaultBackend.image }}
          imagePullPolicy: Always
          ports:
          - containerPort: 8080
- |
  apiVersion: v1
  kind: Service
  metadata:
    name: be-default-{{ .Release.Name }}
    namespace: {{ include "kubernetes-ingress.namespace" . }}
  spec:
    ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
    selector:
      app: nexops