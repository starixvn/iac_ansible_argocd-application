---
controller:
  replicaCount: 1

  config:
    # ssl-certificate: "haproxy-ingress/nebula-cert"
    stats-config-snippet: |
      stats auth nexops:NexOps!QAZ
      stats refresh 300s
      stats show-legends
      stats show-node
      stats show-modules

  nodeSelector:
    haproxy: "yes"

  extraArgs:
  - --disable-ipv6
  - --configmap-tcp-services=haproxy-ingress/tcp-configmap

  logging:
    level: info
    traffic:
      address: "stdout"
      format: "raw"
      facility: "daemon"
  
  service:
    type: LoadBalancer
    tcpPorts:
    - name: logstash
      port: 15044
      targetPort: 15044
      protocol: TCP

    externalTrafficPolicy: "Local"
  


# Add-on component
extraResources:
  - |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: tcp-configmap
      namespace: haproxy-ingress
    data:
      15044:
        logging/logstash-testlab-logstash:5044