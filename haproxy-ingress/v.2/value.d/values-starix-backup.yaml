---
controller:
  config:
    ssl-certificate: "haproxy-ingress/nexdev-cert"
    stats-config-snippet: |
      stats auth nexops:NexOps!QAZ
      stats refresh 300s
      stats show-legends
      stats show-node
      stats show-modules
    frontend-config-snippet: |
      capture request header Host len 30
      capture request header User-Agent len 200
      capture request header Referer len 800
      capture request header X-Forwarded-For len 20
    backend-config-snippet: |
      option forwardfor if-none

  # extraArgs:
  # - --disable-ipv6

  service:
    type: LoadBalancer
    externalTrafficPolicy: "Local"
    # ipFamilyPolicy: SingleStack
    # ipFamilies: [IPv4]

  logging:
    level: info
    traffic:
      address: "stdout"
      format: "raw"
      facility: "daemon"
      
    # traffic:
    #   address: "10.10.50.121"
    #   port: "30505"
    #   format: "rfc3164"
    #   facility: "local4"

  nodeSelector:
    node-role.kubernetes.io/master: "true"
    node-role.kubernetes.io/control-plane: "true"

  serviceMonitor:
    enabled: true
    extraLabels: {}
    endpoints:
      - port: stat
        path: /metrics
        scheme: http
        interval: 30s

extraResources:
- |
  apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: dummy-load-starixsoft-cert
    namespace: haproxy-ingress
  spec:
    ingressClassName: haproxy
    tls:
    - hosts:
      - "*.starixsoft.com"
      secretName: starixsoft-cert
    rules:
    - host: "*.starixsoft.com"

- |
  apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: dummy-load-lumigame-cert
    namespace: haproxy-ingress
  spec:
    ingressClassName: haproxy
    tls:
    - hosts:
      - "*.lumigame.com"
      secretName: lumigame-cert
    rules:
    - host: "*.lumigame.com"