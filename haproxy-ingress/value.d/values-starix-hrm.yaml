---
controller:
  kind: DaemonSet
  config:
    ssl-certificate: "haproxy-ingress/hrm-cert"
    stats-config-snippet: |
      stats auth nexcel:NexOps!QAZ
      stats refresh 300s
      stats show-legends
      stats show-node
      stats show-modules
    frontend-config-snippet: |
      capture request header Host len 30
      capture request header User-Agent len 200
      capture request header Referer len 800
      capture request header X-Forwarded-For len 20
    backend-config-snippet: |
      option forwardfor if-none
    ssl-redirect-port: "443"
      
  extraArgs:
    - --disable-ipv6
    - --configmap-errorfiles=haproxy-ingress/errorfile

  service:
    type: LoadBalancer
    externalTrafficPolicy: "Local"
    ipFamilyPolicy: SingleStack
    ipFamilies: [IPv4]

    nodePorts:
      http: 31080
      https: 31443
      stat: 31024

  # logging:
  #   level: info
  #   traffic:
  #     address: "vn-st-ing-prod.nebula.prod"
  #     port: "30045"
  #     format: "rfc3164"
  #     facility: "local5"

  nodeSelector:
    node-role.kubernetes.io/control-plane: ""

  tolerations:
  - effect: NoSchedule
    key: node-role.kubernetes.io/control-plane

  serviceMonitor:
    enabled: true
    extraLabels: {}
    endpoints:
      - port: stat
        path: /metrics
        scheme: http
        interval: 30s

defaultBackend:
  image: "harbor.byb6181.com/vn-st/base/nexops-tools/default-backend-ingress"

extraResources:
##############################
## WILDCARD SSL LOADER
##############################
- |
  apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: dummy-cert-loader
    namespace: {{ include "kubernetes-ingress.namespace" . }}
  spec:
    ingressClassName: {{ .Values.controller.ingressClassResource.name }}
    tls:
    - hosts:
      - "*.sms-vn.com"
      secretName: hrm-cert
    - hosts:
      - "*.nexdev.net"
      secretName: nexdev-cert
    - hosts:
      - "*.comtechsb.com"
      secretName: comtechsb-cert
    - hosts:
      - "hrm-lexfin.nexdev.net"
      secretName: nexdev-lexfin-cert-le
    rules:
    - host: "*.sms-vn.com" 

##############################
## DEFAULT BACKEND CONF
##############################
- |
  apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: be-default-{{ .Release.Name }}
    namespace: {{ include "kubernetes-ingress.namespace" . }}
  spec:
    ingressClassName: {{ .Values.controller.ingressClassResource.name }}
    rules:
    - host: vn-starix-ing-hrm.nexdev.net
      http:
        paths:
        - backend:
            service:
              name: {{ include "kubernetes-ingress.fullname" . }}
              port:
                number: 1024
          path: /
          pathType: Prefix
    defaultBackend:
      service:
        name: be-default-{{ .Release.Name }}
        port:
          number: 80
- |
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: be-default-{{ .Release.Name }}
    namespace: {{ include "kubernetes-ingress.namespace" . }}
  spec:
    replicas: 2
    selector:
      matchLabels:
        app: nexops
    template:
      metadata:
        labels:
          app: nexops
      spec:
        containers:
        - name: nexops
          image: {{ .Values.defaultBackend.image }}
          imagePullPolicy: Always
          ports:
          - containerPort: 80
          env:
          - name: CLUSTER_NAME
            value: "k8s-starix-hrm"
- |
  apiVersion: v1
  kind: Service
  metadata:
    name: be-default-{{ .Release.Name }}
    namespace: {{ include "kubernetes-ingress.namespace" . }}
  spec:
    ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
    selector:
      app: nexops

## Expose another LoadBalancer Service Public
- |
  apiVersion: v1
  kind: Service
  metadata:
    labels:
      app.kubernetes.io/instance: haproxy-ingress-starix-hrm
      app.kubernetes.io/name: kubernetes-ingress
    name: haproxy-ingress-starix-hrm-public-kubernetes-ingress
    namespace: haproxy-ingress
  spec:
    externalTrafficPolicy: Local
    internalTrafficPolicy: Cluster
    ipFamilies:
    - IPv4
    ipFamilyPolicy: SingleStack
    ports:
    - appProtocol: http
      name: http
      port: 80
      protocol: TCP
      targetPort: http
    - appProtocol: https
      name: https
      port: 443
      protocol: TCP
      targetPort: https
    - appProtocol: https
      name: quic
      port: 443
      protocol: UDP
      targetPort: quic
    - name: stat
      port: 1024
      protocol: TCP
      targetPort: stat
    - name: prometheus
      port: 6060
      protocol: TCP
      targetPort: prometheus
    selector:
      app.kubernetes.io/instance: haproxy-ingress-starix-hrm
      app.kubernetes.io/name: kubernetes-ingress
    sessionAffinity: None
    type: LoadBalancer

## Config Map 503 Page
- |
  apiVersion: v1
  kind: ConfigMap
  metadata:
    name: errorfile
    namespace: haproxy-ingress
  data:
    503: |-
      HTTP/1.1 503 Service Unavailable
      Cache-Control: no-cache
      Connection: close
      Content-Type: text/html

      <!DOCTYPE html>
      <html lang="en">
      <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Service Unavailable</title>
          <!-- Cluster: k8s-starix-hrm -->
          <style>
              body {
                  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                  background-color: #f8f9fa;
                  color: #343a40;
                  margin: 0;
                  padding: 0;
                  display: flex;
                  justify-content: center;
                  align-items: center;
                  height: 100vh;
              }
              .container {
                  background-color: white;
                  padding: 2rem;
                  border-radius: 12px;
                  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
                  max-width: 600px;
                  width: 90%;
                  text-align: center;
              }
              .main-message {
                  font-size: 1.8rem;
                  font-weight: 600;
                  margin-bottom: 1rem;
                  color: #333;
              }
              .sub-message {
                  font-size: 1.1rem;
                  line-height: 1.5;
                  color: #666;
                  margin-bottom: 1.5rem;
              }
              .help-box {
                  background-color: #f1f3f5;
                  padding: 1.5rem;
                  border-radius: 8px;
                  margin: 1.5rem 0;
                  text-align: left;
              }
              .help-title {
                  font-weight: 600;
                  margin-bottom: 0.5rem;
                  color: #444;
              }
              .cluster-info {
                  position: fixed;
                  bottom: 10px;
                  right: 10px;
                  font-size: 0.7rem;
                  color: #aaa;
                  opacity: 0.5;
              }
          </style>
      </head>
      <body>
          <div class="container">
              <h1 class="main-message">Service Unavailable</h1>
              <p class="sub-message">The server is currently unable to handle the request due to a temporary overload or maintenance. Please try again later.</p>
              
              <div class="help-box">
                  <p class="help-title">What you can do</p>
                  <ul>
                      <li>Wait a few minutes and refresh the page</li>
                      <li>Check your network connection</li>
                      <li>Contact the website administrator if the problem persists</li>
                  </ul>
              </div>
          </div>
      </body>
      </html>
