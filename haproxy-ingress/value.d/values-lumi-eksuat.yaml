---
controller:
  kind: Deployment
  replicaCount: 2
  config:
    # ssl-certificate: "haproxy-ingress/lumigame-cert"
    stats-config-snippet: |
      stats auth lumi:lum!onRock
      stats refresh 300s
      stats show-legends
      stats show-node
      stats show-modules
    frontend-config-snippet: |
      capture request header Host len 30
      capture request header User-Agent len 200
      capture request header Referer len 800
      capture request header X-Forwarded-For len 20
    backend-config-snippet: |
      option forwardfor if-none
    
  service:
    type: LoadBalancer
    # externalTrafficPolicy: "Local"
    ipFamilyPolicy: SingleStack
    ipFamilies: [IPv4]
    enablePorts:
      quic: false

    nodePorts:
      http: 31080
      https: 31443
      stat: 31024
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: Dept=VNTeam,Team=Lumi,ManageBy=vnTerraform,map-migrated=migQK0IMQ5LFK,Environment=UAT,Name=lumi-uat-eks-lb-1
      service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
      service.beta.kubernetes.io/aws-load-balancer-internal: "true"
      service.beta.kubernetes.io/aws-load-balancer-name: lumi-uat-eks-lb-1
      service.beta.kubernetes.io/aws-load-balancer-subnets: subnet-0ae72c2068513e76b,subnet-0ba2a5f74ec351acc,subnet-0f92f11b87239fbd5
      service.beta.kubernetes.io/aws-load-balancer-type: nlb

  extraArgs:
    - --disable-ipv6

  logging:
    level: info
    traffic:
      address: "address:rsyslog-service.logging"
      port: "514"
      format: "rfc3164"
      facility: "local1"

  serviceMonitor:
    enabled: true
    extraLabels: {}
    endpoints:
      - port: stat
        path: /metrics
        scheme: http
        interval: 30s

  ingressClassResource:
    name: haproxy-nexops
    default: false
  
  ingressClass: haproxy-nexops

  nodeSelector:
    haproxy: "yes"
  #   node-role.kubernetes.io/master: ""
  #   node-role.kubernetes.io/control-plane: ""

  # tolerations:
  # - effect: NoSchedule
  #   key: node-role.kubernetes.io/master
  # - effect: NoSchedule
  #   key: node-role.kubernetes.io/control-plane

  resources: {}

defaultBackend:
  image: "lumhub.sportsfun.app/aws/base/nexops-tools/default-backend-ingress"

extraResources:
