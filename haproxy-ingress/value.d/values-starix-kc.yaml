---
controller:
  kind: DaemonSet
  ingressClass: haproxy

  kubernetesGateway:
    enabled: true
    gatewayControllerName: haproxy.org/gateway-controller

  config:
    stats-config-snippet: |
      stats auth nexcel:NexOps!QAZ
      stats refresh 300s
      stats show-legends
      stats show-node
      stats show-modules
    frontend-config-snippet: |
      capture request header Host len 30
      capture request header User-Agent len 200
      capture request header Referer len 800
      capture request header X-Forwarded-For len 20
    backend-config-snippet: |
      option forwardfor if-none
      
  extraArgs:
    - --disable-ipv6

  service:
    type: LoadBalancer
    externalTrafficPolicy: "Local"
    ipFamilyPolicy: SingleStack
    ipFamilies: [IPv4]

    nodePorts:
      http: 31080
      https: 31443
      stat: 31024

  # logging:
  #   level: info
  #   traffic:
  #     address: "vn-st-ing-prod.nebula.prod"
  #     port: "30045"
  #     format: "rfc3164"
  #     facility: "local5"

  nodeSelector:
    node-role.kubernetes.io/control-plane: ""

  tolerations:
  - effect: NoSchedule
    key: node-role.kubernetes.io/control-plane

  serviceMonitor:
    enabled: true
    extraLabels: {}
    endpoints:
      - port: stat
        path: /metrics
        scheme: http
        interval: 30s

