---
controller:
  kind: DaemonSet
  config:
    ssl-certificate: "haproxy-ingress/lumigame-cert"
    stats-config-snippet: |
      stats auth lumi:lum!onRock
      stats refresh 300s
      stats show-legends
      stats show-node
      stats show-modules
    frontend-config-snippet: |
      capture request header Host len 30
      capture request header User-Agent len 200
      capture request header Referer len 800
      capture request header X-Forwarded-For len 20
    backend-config-snippet: |
      option forwardfor if-none
    
  service:
    type: LoadBalancer
    externalTrafficPolicy: "Local"
    ipFamilyPolicy: SingleStack
    ipFamilies: [IPv4]

    nodePorts:
      http: 31080
      https: 31443
      stat: 31024
  
  extraArgs:
    - --disable-ipv6
    - --configmap-errorfiles=haproxy-ingress/errorfile

  logging:
    level: info
    traffic:
      address: "10.10.50.121"
      port: "30505"
      format: "rfc3164"
      facility: "local4"

  serviceMonitor:
    enabled: true
    extraLabels: {}
    endpoints:
      - port: stat
        path: /metrics
        scheme: http
        interval: 30s

  nodeSelector:
    node-role.kubernetes.io/master: ""
    node-role.kubernetes.io/control-plane: ""

  tolerations:
  - effect: NoSchedule
    key: node-role.kubernetes.io/master
  - effect: NoSchedule
    key: node-role.kubernetes.io/control-plane
    

defaultBackend:
  image: "hub.nexdev.net/base/nexops-tools/default-backend-ingress"

extraResources:
##############################
## WILDCARD SSL LOADER
##############################
- |
  apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: dummy-cert-loader
    namespace: {{ include "kubernetes-ingress.namespace" . }}
  spec:
    ingressClassName: {{ .Values.controller.ingressClassResource.name }}
    tls:
    - hosts:
      - "*.lumigame.com"
      secretName: lumigame-cert
    rules:
    - host: "*.lumi.local" 

##############################
## INGRESS STAT SITE
##############################
- |
  apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: stat-{{ .Release.Name }}
    namespace: {{ include "kubernetes-ingress.namespace" . }}
    annotations:
      haproxy.org/ssl-redirect: "true"
  spec:
    ingressClassName: {{ .Values.controller.ingressClassResource.name }}
    rules:
    - host: ing-stat.lumigame.com
      http:
        paths:
        - backend:
            service:
              name: {{ include "kubernetes-ingress.fullname" . }}
              port:
                number: 1024
          path: /
          pathType: Prefix         

##############################
## DEFAULT BACKEND CONF
##############################
- |
  apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: be-default-{{ .Release.Name }}
    namespace: {{ include "kubernetes-ingress.namespace" . }}
  spec:
    ingressClassName: {{ .Values.controller.ingressClassResource.name }}
    defaultBackend:
      service:
        name: be-default-{{ .Release.Name }}
        port:
          number: 80
- |
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: be-default-{{ .Release.Name }}
    namespace: {{ include "kubernetes-ingress.namespace" . }}
  spec:
    replicas: 2
    selector:
      matchLabels:
        app: nexops
    template:
      metadata:
        labels:
          app: nexops
      spec:
        containers:
        - name: nexops
          image: {{ .Values.defaultBackend.image }}
          imagePullPolicy: Always
          ports:
          - containerPort: 80
          env:
          - name: CLUSTER_NAME
            value: "k8s-sc-local"
- |
  apiVersion: v1
  kind: Service
  metadata:
    name: be-default-{{ .Release.Name }}
    namespace: {{ include "kubernetes-ingress.namespace" . }}
  spec:
    ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
    selector:
      app: nexops
### Config Map 503 Page
- |
  apiVersion: v1
  kind: ConfigMap
  metadata:
    name: errorfile
    namespace: haproxy-ingress
  data:
    503: |-
      HTTP/1.0 503 Service Unavailable
      Cache-Control: no-cache
      Connection: close
      Content-Type: text/html

      <!DOCTYPE html>
      <html lang="en">
      <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Service Unavailable</title>
          <style>
              body {
                  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                  background-color: #f8f9fa;
                  color: #343a40;
                  margin: 0;
                  padding: 0;
                  display: flex;
                  justify-content: center;
                  align-items: center;
                  height: 100vh;
              }
              .container {
                  background-color: white;
                  padding: 2rem;
                  border-radius: 12px;
                  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
                  max-width: 600px;
                  width: 90%;
                  text-align: center;
              }
              .main-message {
                  font-size: 1.8rem;
                  font-weight: 600;
                  margin-bottom: 1rem;
                  color: #333;
              }
              .sub-message {
                  font-size: 1.1rem;
                  line-height: 1.5;
                  color: #666;
                  margin-bottom: 1.5rem;
              }
              .help-box {
                  background-color: #f1f3f5;
                  padding: 1.5rem;
                  border-radius: 8px;
                  margin: 1.5rem 0;
                  text-align: left;
              }
              .help-title {
                  font-weight: 600;
                  margin-bottom: 0.5rem;
                  color: #444;
              }
              .cluster-info {
                  position: fixed;
                  bottom: 10px;
                  right: 10px;
                  font-size: 0.7rem;
                  color: #aaa;
                  opacity: 0.5;
              }
          </style>
      </head>
      <body>
          <div class="container">
              <h1 class="main-message">Service Unavailable</h1>
              <p class="sub-message">The server is currently unable to handle the request due to a temporary overload or maintenance. Please try again later.</p>
              
              <div class="help-box">
                  <p class="help-title">What you can do?? broo:</p>
                  <ul>
                      <li>Wait a few minutes and refresh the page</li>
                      <li>Check your network connection</li>
                      <li>Contact the website administrator if the problem persists</li>
                  </ul>
              </div>
          </div>
      </body>
      </html>


