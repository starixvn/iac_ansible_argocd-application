---
controller:
  kind: DaemonSet
  config:
    ssl-certificate: "haproxy-ingress/lumigame-cert"
    stats-config-snippet: |
      stats auth lumi:lum!onRock
      stats refresh 300s
      stats show-legends
      stats show-node
      stats show-modules
    frontend-config-snippet: |
      capture request header Host len 30
      capture request header User-Agent len 200
      capture request header Referer len 800
      capture request header X-Forwarded-For len 20
    backend-config-snippet: |
      option forwardfor if-none
    
  service:
    type: LoadBalancer
    externalTrafficPolicy: "Local"
    ipFamilyPolicy: SingleStack
    ipFamilies: [IPv4]
  
  extraArgs:
    - --disable-ipv6

  logging:
    level: info
    traffic:
      address: "10.10.50.121"
      port: "30505"
      format: "rfc3164"
      facility: "local4"

  serviceMonitor:
    enabled: true
    extraLabels: {}
    endpoints:
      - port: stat
        path: /metrics
        scheme: http
        interval: 30s

  nodeSelector:
    node-role.kubernetes.io/master: ""
    node-role.kubernetes.io/control-plane: ""

  tolerations:
  - effect: NoSchedule
    key: node-role.kubernetes.io/master
  - effect: NoSchedule
    key: node-role.kubernetes.io/control-plane
    

defaultBackend:
  image: "hub.lumigame.com/base/nexops-tools/default-backend-ingress"

extraResources:
##############################
## WILDCARD SSL CONF
##############################
- |
  apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: dummy-load-starixwork-cert
    namespace: haproxy-ingress
  spec:
    ingressClassName: haproxy
    tls:
    - hosts:
      - "*.lumigame.com"
      secretName: lumigame-cert
    rules:
    - host: "*.lumigame.com"

##############################
## INGRESS STAT SITE
##############################
- |
  apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: stat-{{ .Release.Name }}
    namespace: {{ include "kubernetes-ingress.namespace" . }}
    annotations:
      haproxy.org/ssl-redirect: "true"
  spec:
    ingressClassName: {{ .Values.controller.ingressClassResource.name }}
    rules:
    - host: ing-stat-new.lumigame.com
      http:
        paths:
        - backend:
            service:
              name: {{ include "kubernetes-ingress.fullname" . }}
              port:
                number: 1024
          path: /
          pathType: Prefix
          

##############################
## DEFAULT BACKEND CONF
##############################
- |
  apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: be-default-{{ .Release.Name }}
    namespace: {{ include "kubernetes-ingress.namespace" . }}
  spec:
    ingressClassName: {{ .Values.controller.ingressClassResource.name }}
    defaultBackend:
      service:
        name: be-default-{{ .Release.Name }}
        port:
          number: 80
- |
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: be-default-{{ .Release.Name }}
    namespace: {{ include "kubernetes-ingress.namespace" . }}
  spec:
    replicas: 2
    selector:
      matchLabels:
        app: nexops
    template:
      metadata:
        labels:
          app: nexops
      spec:
        containers:
        - name: nexops
          image: {{ .Values.defaultBackend.image }}
          imagePullPolicy: Always
          ports:
          - containerPort: 8080
- |
  apiVersion: v1
  kind: Service
  metadata:
    name: be-default-{{ .Release.Name }}
    namespace: {{ include "kubernetes-ingress.namespace" . }}
  spec:
    ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
    selector:
      app: nexops
