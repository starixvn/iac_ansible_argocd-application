config:
  cluster:
    enabled: true
    replicas: 3

  jetstream:
    enabled: true
    fileStore:
      pvc:
        enabled: true
        size: 8Gi
        storageClassName: longhorn
    memoryStore:
      enabled: false

promExporter:
  enabled: true
  podMonitor:
    enabled: true



