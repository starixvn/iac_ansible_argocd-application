- apiVersion: v1
  kind: Service
  metadata:
    name: 
      $tplYaml: >
        {{ include "nats.fullname" $ | printf "%s-lb" | quote }}
    labels:
      $tplYaml: |
        {{ include "nats.labels" $ }}
  spec:
    selector:
      $tplYaml: |
        {{- include "nats.selectorLabels" $ }}
    ports:
      - appProtocol: tcp
        name: nats
        port: 4222
        protocol: TCP
        targetPort: nats
        # nodePort: 30222
    type: LoadBalancer