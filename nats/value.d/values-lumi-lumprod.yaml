config:
  cluster:
    enabled: true
    replicas: 3

  jetstream:
    enabled: true
    fileStore:
      pvc:
        enabled: true
        size: 8Gi
        storageClassName: longhorn
    memoryStore:
      enabled: false

promExporter:
  enabled: true
  podMonitor:
    enabled: true



extraResources:
- apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: 
      $tplYaml: >
        {{ include "nats.fullname" $ | quote }}
    labels:
      $tplYaml: |
        {{ include "nats.labels" $ }}
  spec:
    rules:
    - host: "nats.lumigame.com"
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name:
                $tplYaml: >
                  {{ .Values.service.name | quote }}
              port:
                name: nats
