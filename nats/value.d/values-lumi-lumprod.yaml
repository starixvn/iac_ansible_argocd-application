config:
  cluster:
    enabled: true
    name: nats
    replicas: 3

  jetstream:
    enabled: true
    memoryStore:
      enabled: false
    fileStore:
      pvc:
        enabled: true
        size: 8Gi
        storageClassName: longhorn

  nats:
    nodePort: 30222

promExporter:
  enabled: true
  image: 
    tag: 0.15.0

  podMonitor:
    enabled: true