---
# opensearchHosts: "https://opensearch-cluster-lumi:9200"
resources:
  requests:
    cpu: "100m"
    memory: "512M"
  limits:
    cpu: "500m"
    memory: "2Gi"

# service:
#   type: NodePort
#   nodePort: "31601"

ingress:
  enabled: true
  ingressClassName: "haproxy"
  hosts:
  - host: logs.starixplay.com
    paths:
      - path: /
        backend:
          serviceName: ""
          servicePort: ""
  annotations:
    ingress.kubernetes.io/ssl-redirect: "true"