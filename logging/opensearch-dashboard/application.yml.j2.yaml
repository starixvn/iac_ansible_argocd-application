apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opensearch-dashboard-{{env}}
  namespace: argocd
  labels:
    name: opensearch-dashboard-{{env}}
    env: {{env}}
    org: {{org}}
spec:
  destination:
    server: "{{ info[org][env]["cluster"] }}"
    namespace: logging
  project: default
  source:
    repoURL: "{{repoURL}}"
    path: opensearch/opensearch-dashboards
    targetRevision: HEAD
    helm:
      releaseName: opensearch-dashboard-{{env}}
      valuesObject:
        opensearchHosts: "https://opensearch-cluster-master:9200"
        image:
          repository: "hub.nexdev.net/base/opensearchproject/opensearch-dashboards"
          tag: "2.13.0"
        nodeSelector:
          nexops-tools: "yes"
        service:
          type: NodePort
          nodePort: "31601"

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5 # number of failed sync attempt retries; unlimited number of attempts if less than 0
      backoff:
        duration: 5s # the amount to back off. Default unit is seconds, but could also be a duration (e.g. "2m", "1h")
        factor: 2 # a factor to multiply the base duration after each failed retry
        maxDuration: 3m