replicas: 2

logstashConfig:
  logstash.yml: |
    http.host: "0.0.0.0"

logstashPipeline:
  logstash.conf: |
    input {
      tcp {
        port => 5044
      }
      syslog {
        port => 5045
        type => "syslog"
        tags => ["uat"]
      }
      tcp {
        port => 5064
        type => "vault"
        tags => ["uat", "starix"]
      }
    }

  vault_filter.conf: |
    filter {
      if [type] == "vault" {
        json {
          source => "message"
        }
        mutate {
          rename => {
            "[type]" => "[event_type]"
            "[response][data][error]" => "[response_error]"
          }
          remove_field => ["[event][original]","[response][data]"]
          add_field => {"type" => "vault"}
        }

        if [auth][display_name] == "approle" and [request][mount_type] == "kv" and [request][operation] == "read" { drop {} }
        else if [auth][display_name] == "approle" and [request][operation] == "read" and [request][path] == "auth/token/lookup-self" { drop {} }
      }
    }

  syslog_filter.conf: |
    filter {
      if [type] == "syslog" {
        if [program] == "haproxy" {
          if [facility_label] == "local1" {
            mutate {
              add_tag => ["haproxy_access", "hap-ing", "devops"]
            }
          } 
          else if [facility_label] == "local2" {
            mutate {
              add_tag => ["haproxy_access", "hap-gw"]
            }
          }
          else if [facility_label] == "local5" {
            mutate {
              add_tag => ["haproxy_access", "hap-ing", "sc"]
            }
          }
          else {
            mutate {
              add_tag => ["haproxy_access"]
            }
          }
        }
      }

      if "haproxy_access" in [tags] {
        grok {
          match => [
            "message","%{HAPROXYHTTPBASE}",
            "message","%{HAPROXYHTTP}",
            "message","%{HAPROXYTCP}"
          ]
        }
        if ![accept_date] {
          grok { match => ["message", "%{HAPROXYDATE:accept_date}"] }
        }
        if [captured_request_headers] {
          grok { match => {
              "captured_request_headers" => [
                "%{DATA:request_host}\|(%{DATA:user-agent})?\|(%{DATA:request_referer})?\|(%{IP:TrueClientIP})?" 
              ]
            }
          }

          # Define expected headers
          mutate {
            add_field => {
              "[_tmp][header_names]" => "Host|User-Agent|Referer|X-Forwarded-For"
            }
          }
          mutate {
            split => {
              "[_tmp][header_names]" => "|"
            }
          }

          # Standarized headers field
          # Standarized headers field
          ruby {
            code => '
              raw_header = event.get("captured_request_headers")
              if raw_header.is_a?(String)
                split_headers = raw_header.split("|", -1)
                event.set("captured_request_headers", split_headers)
              end
              raw_header_name = event.get("[_tmp][header_names]")
              if raw_header_name.is_a?(String)
                split_headers = raw_header_name.split("|", -1)
                event.set("[_tmp][header_names]", split_headers)
              end
              header_keys = event.get("[_tmp][header_names]")
              header_vals = event.get("captured_request_headers")

              if header_keys.is_a?(Array) && header_vals.is_a?(Array)
                if header_keys.length == header_vals.length
                  headers = header_keys.zip(header_vals).map do |k, v|
                    { "name" => k, "value" => v }
                  end
                  event.set("[httpRequest][headers]", headers)
                else
                  event.tag("header_parse_mismatch")
                  event.set("[httpRequest][headers_parse_error]", {
                    "expected_keys" => header_keys.length,
                    "actual_values" => header_vals.length
                  })
                end
              else
                event.tag("header_parse_error")
              end
            '
          }

          # Cleanup temporary fields
          mutate {
            remove_field => ["_tmp"]
          }
        }
        mutate {
          remove_field => ["captured_response_cookie","haproxy_time","haproxy_month","haproxy_hour","srvconn","backend_queue","retries","termination_state"]
          remove_field => ["haproxy_monthday","time_backend_connect","pid","srv_queue","beat","beconn","client_port","haproxy_milliseconds","@version"]
          remove_field => ["haproxy_minute","offset","haproxy_second","actconn","source","program","haproxy_year","feconn","http_version"]
          remove_field => ["prospector","time_duration","time_queue","syslog_timestamp","captured_request_cookie","timestamp8601"]
          convert => {
            "http_status_code" => "integer"
            "time_backend_response" => "integer"
          }
        }
        date {match => ["accept_date", "dd/MMM/yyyy:HH:mm:ss.SSS"]}
        if [TrueClientIP] {
          geoip { source => "TrueClientIP" }
        }

        if "hap-gw" in [tags] {
        }
        else if "hap-ing" in [tags] {
          # if [http_status_code] == 200 and  [time_backend_response] < 5000 { drop {} }
          if [backend_name] == "stats" { drop {} }
          else if [http_host] =~ /(vn-s1-jaeger-collector-uat.nebula.prod)/ { drop {} }
        }
      }
    }

  vault_output.conf: |
    output {
      if [type] == "vault" {
        if "uat" in [tags] and "starix" in [tags] {
          opensearch {
            hosts => ["https://vn-st-ing-prod.nebula.prod:31920"]
            user => "logstash"
            password => "logstash"
            ssl => true
            ssl_certificate_verification => false
            index => "logstash-vault-audit-starix-uat"
            action => "create"
          }        
        }
        else {
          opensearch {
            hosts => ["https://vn-st-ing-prod.nebula.prod:31920"]
            user => "logstash"
            password => "logstash"
            ssl => true
            ssl_certificate_verification => false
            index => "logstash-vault-unknown"
            action => "create"
          }       
        }
      }
    }

  syslog_output.conf: |
    output {
      if [type] == "syslog" {
        if "hap-gw" in [tags] {
          opensearch {
            hosts => ["https://vn-st-ing-prod.nebula.prod:31920"]
            user => "logstash"
            password => "logstash"
            ssl => true
            ssl_certificate_verification => false
            index => "logstash-haproxy-gw-uat-%{+YYYY.MM.dd}"
          }         
        }
        else if "hap-ing" in [tags] {
          if "devops" in [tags] and "uat" in [tags] {
            opensearch {
              hosts => ["https://vn-st-ing-prod.nebula.prod:31920"]
              user => "logstash"
              password => "logstash"
              ssl => true
              ssl_certificate_verification => false
              index => "logstash-haproxy-ing-devops-uat"
              action => "create"
            }
          }
          else if "sc" in [tags] and "uat" in [tags] {
            opensearch {
              hosts => ["https://vn-st-ing-prod.nebula.prod:31920"]
              user => "logstash"
              password => "logstash"
              ssl => true
              ssl_certificate_verification => false
              index => "logstash-haproxy-ing-sc-uat"
              action => "create"
            }
          }
          else {
            opensearch {
              hosts => ["https://vn-st-ing-prod.nebula.prod:31920"]
              user => "logstash"
              password => "logstash"
              ssl => true
              ssl_certificate_verification => false
              index => "logstash-haproxy-uat-unknown"
              action => "create"
            }         
          }
        }
      }
    }

  main_output.conf: |
    output {
      if [type] not in ["http", "tcp", "syslog", "vault"] {
        opensearch {
          hosts => ["https://vn-st-ing-prod.nebula.prod:31920"]
          user => "logstash"
          password => "logstash"
          ssl => true
          ssl_certificate_verification => false
          index => "logstash-unknown"
          action => "create"
        }   
      }
    }
    


logstashJavaOpts: "-Xmx3g -Xms3g"

resources:
  requests:
    cpu: "100m"
    memory: "4096Mi"
  limits:
    cpu: "1000m"
    memory: "4096Mi"



httpPort: 9600
extraPorts:
  - name: tcp
    containerPort: 5044
  - name: syslog-tcp
    containerPort: 5045
    protocol: TCP
  - name: syslog-udp
    containerPort: 5045
    protocol: UDP
  - name: vault-st-uat
    containerPort: 5064

service:
  type: NodePort
  ports:
  - name: tcp
    nodePort: 30504
    port: 5044
    protocol: TCP
    targetPort: tcp
  - name: syslog-tcp
    nodePort: 30045
    port: 5045
    protocol: TCP
    targetPort: syslog-tcp
  - name: syslog-udp
    nodePort: 30045
    port: 5045
    protocol: UDP
    targetPort: syslog-udp
  - name: vault-st-uat
    nodePort: 30064
    port: 5064
    protocol: TCP
    targetPort: vault-st-uat
