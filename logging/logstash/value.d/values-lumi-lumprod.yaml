  db_output.conf: |
    output {
      if [agent][name] =~ /postgresql.*/ {
        opensearch {
          hosts => ["https://opensearch-cluster-master:9200"]
          user => "logstash"
          password => "logstash"
          ssl => true
          ssl_certificate_verification => false
          index => "logstash-postgres-%{+YYYY.MM.dd}"   
        }
      }
    }


  vault_output.conf: |
    output {
      if [type] == "vault" {
        if "local" in [tags] and "lumi" in [tags] {
          opensearch {
            hosts => ["https://opensearch-cluster-master:9200"]
            user => "logstash"
            password => "logstash"
            ssl => true
            ssl_certificate_verification => false
            index => "logstash-vault-lumi-local-%{+YYYY.MM.dd}"
          }
        }
      }
    }

  main_output.conf: |
    output {
      if [type] not in ["cloudtrail", "cloudwatch", "vault"] {
        if "haproxy_access" not in [tags] {
          if [agent][name] !~ /postgresql.*/ {
            opensearch {
              hosts => ["https://opensearch-cluster-master:9200"]
              user => "logstash"
              password => "logstash"
              ssl => true
              ssl_certificate_verification => false
              index => "logstash-unknown-%{+YYYY.MM.dd}"
            }
          }
        }  
      }
    }

httpPort: 9600
extraPorts:
  - name: httplog
    containerPort: 8080
  - name: beats
    containerPort: 5000
  - name: tcp
    containerPort: 5044
  - name: syslog
    containerPort: 5045
    protocol: TCP
  - name: vault-lum-local
    containerPort: 5064

  - name: logstash
    containerPort: 9800

service:
  type: NodePort
  ports:
  - name: beats
    nodePort: 30500
    port: 5000
    protocol: TCP
    targetPort: 5000
  - name: httplog
    port: 8080
    protocol: TCP
    targetPort: 8080
  - name: tcp
    nodePort: 30504
    port: 5044
    protocol: TCP
    targetPort: 5044
  - name: syslog
    nodePort: 30505
    port: 5045
    protocol: UDP
    targetPort: 5045
  - name: vault-lum-local
    nodePort: 30064
    port: 5064
    protocol: TCP
    targetPort: 5064

  - name: logstash
    nodePort: 30800
    port: 9800
    protocol: TCP
    targetPort: 9800

nodeSelector: 
  nexops-tools: "yes"