  ######### FILTER PIPELINE #########
  proxy_filter.conf: |
    filter {
      # filter CloudTrail
      if [type] == "cloudtrail" {
        if [eventName] == "UpdateInstanceInformation" {
          drop {}
        }
        else if [eventName] == "PutObject" {
          if [sourceIPAddress] == "cloudtrail.amazonaws.com" and [requestParameters][bucketName] == "aws-cloudtrail-logs-nex-aws-management-events" {
            drop {}
          }
          else if [sourceIPAddress] == "cloudtrail.amazonaws.com" and [requestParameters][bucketName] == "vnteam-aws-cloudtrail-logs-management-events" {
            drop {}
          }
        }
        if [requestParameters][bucketName] == "nexdr" or [requestParameters][bucketName] == "nexec2" or [requestParameters][bucketName] =~ /spnk.*/ {
          drop {}
        }
        mutate {
          convert => {
            "[responseElements][networkInterface][tagSet][items][value]" => "string"
          }
        }
      }

      # Filter CloudWatch
      else if [type] == "cloudwatch" {

        # Filter EKS Logging
        if "eks-controlplane" in [tags] {
          if [cloudwatch_logs][log_stream] =~ /cloud-controller-manager.*/ {
            mutate {
              add_tag => ["cloud-controller-manager"]
            }
          }
          else if [cloudwatch_logs][log_stream] =~ /kube-controller-manager.*/ {
            mutate {
              add_tag => ["kube-controller-manager"]
            }          
          }
          else if [cloudwatch_logs][log_stream] =~ /kube-scheduler.*/ {
            mutate {
              add_tag => ["kube-scheduler"]
            }           
          }
        }
        else if "eks-dataplane" in [tags]  {
          json {
            source => "message"
          }
        }

        else if "eks-containers" in [tags] {
          json {
            source => "message"
          }            
        }

        else if "eks-workernode" in [tags] {
          json {
            source => "message"
          }            
        }

        else if "haproxy_access" in [tags] {
          json {
            source => "message"
          }
          grok {
            match => { "log" => [ "%{HAPROXYHTTP}","%{HAPROXYTCP}" ] }
          }  
        }
      }

      if [type] == "syslog" {
        if [program] == "haproxy" {
          if [facility_label] == "local2" {
            mutate {
              add_tag => ["haproxy_access", "hap-gw"]
            }
          }
          else if [facility_label] == "local1" {
            mutate {
              add_tag => ["haproxy_access", "hap-ing", "lumprod"]
            }
          }
          else if [facility_label] == "local3" {
            mutate {
              add_tag => ["haproxy_access", "hap-ing", "devops"]
            }
          }
          else if [facility_label] == "local4" {
            mutate {
              add_tag => ["haproxy_access", "hap-ing", "sc"]
            }
          }
          else if [facility_label] == "local5" {
            mutate {
              add_tag => ["haproxy_access", "hap-ing", "s1"]
            }
          }
          else {
            mutate {
              add_tag => ["haproxy_access"]
            }
          }
        }
      }

      if "haproxy_access" in [tags] {
        grok {
          match => {
            "message" => [
              "%{HAPROXYHTTPBASE}",
              "%{HAPROXYHTTP}",
              "%{HAPROXYTCP}"
            ]
          }
        }
        if ![accept_date] {
          grok { match => { "message" => ["%{HAPROXYDATE:accept_date}"] } }
        }
        if [captured_request_headers] {
          grok { match => { "captured_request_headers" => ["%{DATA:request_host}\|%{DATA:user-agent}\|(%{DATA:request_referer}\|%{IP:TrueClientIP})"] } }
        }
        mutate {
          remove_field => ["captured_response_cookie","haproxy_time","haproxy_month","haproxy_hour","srvconn","backend_queue","retries","termination_state"]
          remove_field => ["haproxy_monthday","time_backend_connect","pid","srv_queue","beat","beconn","client_port","haproxy_milliseconds","@version"]
          remove_field => ["haproxy_minute","offset","haproxy_second","actconn","source","program","haproxy_year","feconn","http_version"]
          remove_field => ["prospector","time_duration","time_queue","syslog_timestamp","captured_request_cookie","timestamp8601"]
          convert => {
            "http_status_code" => "integer"
            "time_backend_response" => "integer"
          }
        }
        date {
          match => ["accept_date", "dd/MMM/yyyy:HH:mm:ss.SSS"]
        }
        if [TrueClientIP] {
          geoip { source => "TrueClientIP" }
        }
        
        if "hap-gw" in [tags] {
          if [captured_request_headers] =~ /^(Zabbix|Prometheus|sentry|sonarqube|portainer|axios|grafana|whoami|ansible|deploy|rocketor|kibana|haproxy|logs.lumigame.com|npm.lumigame.com)/ {
            drop {}
          }
          if [message] =~ /^(Zabbix|Prometheus|sentry|sonarqube|portainer|axios|health|whoami|healthz|grafana|ansible|deploy|rocketor|kibana|haproxy|logs.lumigame.com|npm.lumigame.com)/ {
            drop {}
          }
          if [http_status_code] == 400 or [http_status_code] == 404 or [http_status_code] == 403 or [http_status_code] == 201 or [http_status_code] == 204 or [http_status_code] == 101 or [http_status_code] == 301 or [http_status_code] == 405 or [http_status_code] == 302 or [http_status_code] == 304 {
            drop {}
          }
          if [http_status_code] == 200 and  [time_backend_response] < 5000 {
            drop {}
          }
          if [referrer] == "hub.lumigame.com" and [http_status_code] == 401 and [http_verb] == "GET" {
            drop {}
          }
          if [user-agent] =~ /containerd/ or [user-agent] =~ /Go-http-client/ or [user-agent] =~ /docker/ or [user-agent] =~ /buildkit/ {
            drop {}
          }
          if [backend_name] == "grafana_be" {
            drop {}
          }
          if [http_request] =~ /(png|jpg|jpeg|gif|svg|css|js|xml|ico|json|mp3|ttf|atlas|otf|webp|csv)$/ {
            drop {}
          }
        }
        else if "hap-ing" in [tags] {
          if [http_status_code] == 200 and  [time_backend_response] < 5000 { drop {} }
          else if [backend_name] == "stats" { drop {} }
        }
        if [type] == "cloudwatch" {
          if [http_request] =~ /(png|jpg|jpeg|gif|svg|css|js|xml|ico|json|mp3|ttf|atlas|otf|webp)$/ {
            drop {}
          }
        }
      }
    }

  vault_filter.conf: |
    filter {
      if [type] == "vault" {
        json {
          source => "message"
        }
        mutate {
          rename => {
            "[type]" => "[event_type]"
            "[response][data][error]" => "[response_error]"
          }
          remove_field => ["[event][original]","[response][data]"]
          add_field => {"type" => "vault"}
        }

        if [auth][display_name] == "approle" and [request][mount_type] == "kv" and [request][operation] == "read" { drop {} }
        else if [auth][display_name] == "approle" and [request][operation] == "read" and [request][path] == "auth/token/lookup-self" { drop {} }
      }
    }

