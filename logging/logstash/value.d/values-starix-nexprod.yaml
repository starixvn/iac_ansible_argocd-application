replicas: 2

logstashConfig:
  logstash.yml: |
    http.host: "0.0.0.0"

logstashPipeline:
  logstash.conf: |
    input {
      http {
        port => 8080
        type => "dev-logs"
        tags => ["http"]
        add_field => { "[@metadata][input-http]" => "" }
      }

      tcp {
        port => 5044
        type => "dev-logs"
        tags => ["tcp"]
      }

      syslog {
        port => 5045
        type => "syslog"
        tags => ["local"]
      }

      tcp {
        port => 5064
        type => "vault"
        tags => ["local", "starix"]
      }

      tcp {
        port => 5065
        type => "vault"
        tags => ["dev", "starix"]
      }

      syslog {
        port => 5077
        type => "debug"
        tags => ["local"]
      }
    }

  vault_filter.conf: |
    filter {
      if [type] == "vault" {
        json {
          source => "message"
        }
        mutate {
          rename => {
            "[type]" => "[event_type]"
            "[response][data][error]" => "[response_error]"
          }
          remove_field => ["[event][original]","[response][data]"]
          add_field => {"[type]" => "vault"}
        }

        if [auth][display_name] == "approle" and [request][mount_type] == "kv" and [request][operation] == "read" { drop {} }
        else if [auth][display_name] == "approle" and [request][operation] == "read" and [request][path] == "auth/token/lookup-self" { drop {} }
      }
    }

  syslog_filter.conf: |
    filter {
      if [type] == "syslog" {
        if [program] == "haproxy" {
          if [facility_label] == "local1" {
            mutate {
              add_tag => ["haproxy_access", "hap-ing", "nexprod"]
            }
          } 
          else if [facility_label] == "local2" {
            mutate {
              add_tag => ["haproxy_access", "hap-gw", "core"]
            }
          }
          else if [facility_label] == "local5" {
            mutate {
              add_tag => ["haproxy_access", "hap-ing", "starix"]
            }
          }
          else {
            mutate {
              add_tag => ["haproxy_access"]
            }
          }
        }
      }
      if "haproxy_access" in [tags] {
        if "hap-gw" in [tags] {
          grok {
            match => {
              "message" => [
                "%{HAPROXYHTTPBASE}",
                "%{HAPROXYHTTP}",
                "%{HAPROXYTCP}",
                "%{HAPROXYGW}"
              ]
            }
          }
          if ![accept_date] {
            grok { match => {message => ["%{HAPROXYDATE:accept_date}"]} }
          }
          if [captured_request_headers] {
            grok { match => {"captured_request_headers" => "%{DATA:request_host}\|%{DATA:user-agent}\|(%{DATA:request_referer}\|%{IP:TrueClientIP})"} }
          }
          mutate {
            remove_field => ["captured_response_cookie","haproxy_time","haproxy_month","haproxy_hour","srvconn","backend_queue","retries","termination_state"]
            remove_field => ["haproxy_monthday","time_backend_connect","pid","srv_queue","beat","beconn","client_port","haproxy_milliseconds","@version"]
            remove_field => ["haproxy_minute","offset","haproxy_second","actconn","source","program","haproxy_year","feconn","http_version"]
            remove_field => ["prospector","time_duration","time_queue","syslog_timestamp","captured_request_cookie","timestamp8601"]
            convert => {
              "http_status_code" => "integer"
              "time_backend_response" => "integer"
            }
            rename => {"syslog_server" => "SyslogSrv"}
          }
          date {
            match => ["accept_date", "dd/MMM/yyyy:HH:mm:ss.SSS"]
            timezone => "Asia/Bangkok"
          }
          if [TrueClientIP] {
            geoip { source => "TrueClientIP" }
          }
          if [captured_request_headers] =~ /^(Zabbix|Prometheus|sentry|sonarqube|portainer|axios|grafana|whoami|ansible|deploy|rocketor|kibana|haproxy|logs.lumigame.com|npm.lumigame.com|ci.nexdev.net)/ {
            drop {}
          }
          if [message] =~ /^(Zabbix|Prometheus|sentry|sonarqube|portainer|axios|health|whoami|healthz|grafana|ansible|deploy|rocketor|kibana|haproxy|logs.lumigame.com|npm.lumigame.com)/ {
            drop {}
          }
          if [http_status_code] == 400 or [http_status_code] == 404 or [http_status_code] == 403 or [http_status_code] == 201 or [http_status_code] == 204 or [http_status_code] == 101 or [http_status_code] == 301 or [http_status_code] == 405 or [http_status_code] == 302 or [http_status_code] == 304 {
            drop {}
          }
          if [http_status_code] == 200 and  [time_backend_response] < 5000 {
            drop {}
          }
          if [referrer] == "hub.lumigame.com" and [http_status_code] == 401 and [http_verb] == "GET" {
            drop {}
          }
          if [user-agent] =~ /containerd/ or [user-agent] =~ /Go-http-client/ or [user-agent] =~ /docker/ or [user-agent] =~ /buildkit/ {
            drop {}
          }
          if [backend_name] == "grafana_be" {
            drop {}
          }
          if [http_request] =~ /(png|jpg|jpeg|gif|svg|css|js|xml|ico|json|mp3|ttf|atlas|otf|webp|csv)$/ {
            drop {}
          }
        }
        else if "hap-ing" in [tags] {
          grok {
            match => { "message" => [
              "%{HAPROXYHTTPBASE}",
              "%{HAPROXYHTTP}",
              "%{HAPROXYTCP}"
            ]
            }
          }
          grok {
            match => ["message", "%{HAPROXYDATE:accept_date}"]
          }
          mutate {
            remove_field => ["captured_response_cookie","haproxy_time","haproxy_month","haproxy_hour","srvconn","backend_queue","retries","termination_state"]
            remove_field => ["haproxy_monthday","time_backend_connect","pid","srv_queue","beconn","client_port","haproxy_milliseconds","@version"]
            remove_field => ["haproxy_minute","haproxy_second","actconn","program","haproxy_year","feconn","http_version"]
            remove_field => ["prospector","time_duration","time_queue","syslog_timestamp","captured_request_cookie","bytes_read","timestamp8601"]
            convert => {
              "http_status_code" => "integer"
              "time_backend_response" => "integer"
            }
            rename => {"syslog_server" => "haproxy-ing-pod"}
          }
          if [http_status_code] == 200 and  [time_backend_response] < 5000 { drop {} }
          else if [backend_name] == "stats" { drop {} }
        }
      }
    }

  debug_filter.conf: |
    filter {
      if [type] == "debug" {
        grok {
          match => {
            "message" => [
              "%{HAPROXYHTTPBASE}",
              "%{HAPROXYHTTP}",
              "%{HAPROXYTCP}",
              "%{HAPROXYGW}"
            ]
          }
        }
        if [backend_name] == "olympus_nap_fanexdataservice_LOCAL_be" or [backend_name] == "olympus_nap_fanexdataservice_LOCAL_1_be" {
          if ![accept_date] {
            grok { match => {message => ["%{HAPROXYDATE:accept_date}"]} }
          }
          if [captured_request_headers] {
            grok { match => {"captured_request_headers" => "%{DATA:request_host}\|%{DATA:user-agent}\|(%{DATA:request_referer}\|%{IP:TrueClientIP})"} }
          }
          mutate {
            convert => {
              "http_status_code" => "integer"
              "time_backend_response" => "integer"
            }
          }
          date {
            match => ["accept_date", "dd/MMM/yyyy:HH:mm:ss.SSS"]
            timezone => "Asia/Bangkok"
          }
          if [TrueClientIP] {
            geoip { source => "TrueClientIP" }
          }
        }
      }
    }

  dev_filter.conf: |
    filter {
      if [type] == "dev-logs"{
        json {
          source => "message"
        }

        ### FPS TEAM
        if "LoginTransaction" in [Tags] or "Transaction07" in [Tags] {
          mutate {
            add_tag => ["fps"]
          }
          useragent {
            source => '[Message][UserAgent]'
            target => "user_agent"
          }
          geoip {
            source => "[Message][IP]"
            target => "geo"
          }
        }

        ### LEGION TEAM
        if [Properties][Team] == "Legion" {
          mutate {
            remove_field => ["[Renderings][HttpLog]", "[Properties][HttpLog]" ]
            add_tag => ["legion"]
          }

          if [Properties][RequestPath] == "/" {
            drop {}
          }

          if [Properties][Application] == "DepositAPI" {
            mutate {
              add_tag => ["deposit"]
            }
          }
          if [Properties][Application] == "DepositAPIGateway" {
            mutate {
              add_tag => ["deposit-apigateway"]
            }
          }

          if [Properties][Application] == "DepositPlayerAPI" {
            mutate {
              add_tag => ["deposit-player"]
            }
          }

          if [Properties][Application] == "DepositSettingAPI" {
            mutate {
              add_tag => ["deposit-setting-api"]
            }
          }

          if [Properties][Application] == "DepositSettingAPIGateway" {
            mutate {
              add_tag => ["deposit-setting-apigateway"]
            }
          }
        }


        ### ROME TEAM
        if [Properties][Team] == "Rome" {
          mutate {
            # remove_field => ["[Renderings]", "[Properties][HttpLog]", "MessageTemplate", "[Properties][Elapsed]", "[Properties][SourceContext]"]
            add_tag => ["rome"]
          }

          if [Properties][RequestPath] == "/" {
            drop {}
          }

          if [Properties][Application] == "Deposit.ApiGateways" {
            mutate {
              add_tag => ["deposit-apigw"]
            }
          }
          if [Properties][Application] == "Licensee.AdminSetting.API" {
            mutate {
              add_tag => ["licensee-adminsetting"]
            }
          }
        }        
      }
    }

  vault_output.conf: |
    output {
      if [type] == "vault" {
        if "local" in [tags] and "starix" in [tags] {
          opensearch {
            hosts => ["https://opensearch-cluster-master:9200"]
            user => "logstash"
            password => "logstash"
            ssl => true
            ssl_certificate_verification => false
            index => "logstash-vault-audit-local-%{+YYYY.MM.dd}"
          }
        }
        else if "dev" in [tags] and "starix" in [tags] {
          opensearch {
            hosts => ["https://opensearch-cluster-master:9200"]
            user => "logstash"
            password => "logstash"
            ssl => true
            ssl_certificate_verification => false
            index => "logstash-vault-audit-dev-%{+YYYY.MM.dd}"
          }
        }
      }
    }

  dev_output.conf: |
    output {
      if [type] == "dev-logs" {
        if "legion" in [tags] {
          if [Properties][Environment] == "LOCAL" {
            if "deposit" in [tags] {
              opensearch {
                hosts => ["https://opensearch-cluster-master:9200"]
                user => "logstash"
                password => "logstash"
                ssl => true
                ssl_certificate_verification => false
                index => "logstash-legion-deposit-local-%{+YYYY.MM.dd}"
              }
            }
            else if "deposit-apigateway" in [tags] {
              opensearch {
                hosts => ["https://opensearch-cluster-master:9200"]
                user => "logstash"
                password => "logstash"
                ssl => true
                ssl_certificate_verification => false
                index => "logstash-legion-deposit-apigateway-local-%{+YYYY.MM.dd}"
              }            
            }
            else if "deposit-player" in [tags] {
              opensearch {
                hosts => ["https://opensearch-cluster-master:9200"]
                user => "logstash"
                password => "logstash"
                ssl => true
                ssl_certificate_verification => false
                index => "logstash-legion-deposit-player-local-%{+YYYY.MM.dd}"
              }            
            }
            else if "deposit-setting-api" in [tags] {
              opensearch {
                hosts => ["https://opensearch-cluster-master:9200"]
                user => "logstash"
                password => "logstash"
                ssl => true
                ssl_certificate_verification => false
                index => "logstash-legion-deposit-setting-api-local-%{+YYYY.MM.dd}"
              }            
            }
            else if "deposit-setting-apigateway" in [tags] {
              opensearch {
                hosts => ["https://opensearch-cluster-master:9200"]
                user => "logstash"
                password => "logstash"
                ssl => true
                ssl_certificate_verification => false
                index => "logstash-legion-deposit-setting-apigateway-local-%{+YYYY.MM.dd}"
              }            
            }
            else {
              opensearch {
                hosts => ["https://opensearch-cluster-master:9200"]
                user => "logstash"
                password => "logstash"
                ssl => true
                ssl_certificate_verification => false
                index => "logstash-legion-unknown-local-%{+YYYY.MM.dd}"
              }           
            }
          }
        }

        else if "rome" in [tags] {
          if [Properties][Environment] == "LOCAL" {
            if "deposit-apigw" in [tags] {
              opensearch {
                hosts => ["https://opensearch-cluster-master:9200"]
                user => "logstash"
                password => "logstash"
                ssl => true
                ssl_certificate_verification => false
                index => "logstash-rome-deposit-apigw-local-%{+YYYY.MM.dd}"
              }
            }
            else if "licensee-adminsetting" in [tags] {
              opensearch {
                hosts => ["https://opensearch-cluster-master:9200"]
                user => "logstash"
                password => "logstash"
                ssl => true
                ssl_certificate_verification => false
                index => "logstash-rome-licensee-adminsetting-local-%{+YYYY.MM.dd}"
              }              
            }
          }
        }

        else if "LoginTransaction" in [Tags] {
          opensearch {
            hosts => ["https://opensearch-cluster-master:9200"]
            user => "logstash"
            password => "logstash"
            ssl => true
            ssl_certificate_verification => false
            index => "logstash-wabisabi-login-trans-local-%{+YYYY.MM.dd}"
          }      
        }
        else if "Transaction07" in [Tags] {
          opensearch {
            hosts => ["https://opensearch-cluster-master:9200"]
            user => "logstash"
            password => "logstash"
            ssl => true
            ssl_certificate_verification => false
            index => "logstash-wabisabi-login-trans7"
            # index => "logstash-wabisabi-login-trans7-%{+YYYY.MM.dd}"
            action => "create"
          }      
        }
        else {
          opensearch {
            hosts => ["https://opensearch-cluster-master:9200"]
            user => "logstash"
            password => "logstash"
            ssl => true
            ssl_certificate_verification => false
            index => "logstash-dev-unknown-%{+YYYY.MM.dd}"
          } 
        }
      }
    }

  syslog_output.conf: |
    output {
      if [type] == "syslog" {
        if "haproxy_access" in [tags] {
          if "core" in [tags] {
            opensearch {
              hosts => ["https://opensearch-cluster-master:9200"]
              user => "logstash"
              password => "logstash"
              ssl => true
              ssl_certificate_verification => false
              index => "logstash-haproxy-gw-local"
              action => "create"
            }         
          }
          else if "nexprod" in [tags] {
            opensearch {
              hosts => ["https://opensearch-cluster-master:9200"]
              user => "logstash"
              password => "logstash"
              ssl => true
              ssl_certificate_verification => false
              index => "logstash-haproxy-ing-nexprod"
              action => "create"
            }  
          }
          else if "starix" in [tags] {
            opensearch {
              hosts => ["https://opensearch-cluster-master:9200"]
              user => "logstash"
              password => "logstash"
              ssl => true
              ssl_certificate_verification => false
              index => "logstash-haproxy-ing-starix-local"
              action => "create"
            }  
          }
          else {
            opensearch {
              hosts => ["https://opensearch-cluster-master:9200"]
              user => "logstash"
              password => "logstash"
              ssl => true
              ssl_certificate_verification => false
              index => "logstash-haproxy-unknown-local"
              action => "create"
            }         
          }
        }
        else {
          opensearch {
            hosts => ["https://opensearch-cluster-master:9200"]
            user => "logstash"
            password => "logstash"
            ssl => true
            ssl_certificate_verification => false
            index => "logstash-syslog-unknown-local"
            action => "create"
          }
        }
      }
    }

  debug_output.conf: |
    output {
      if [type] == "debug" {
        opensearch {
          hosts => ["https://opensearch-cluster-master:9200"]
          user => "logstash"
          password => "logstash"
          ssl => true
          ssl_certificate_verification => false
          index => "logstash-debug-local"
        }   
      }
    }

  main_output.conf: |
    output {
      if [type] not in ["syslog", "vault", "dev-logs", "debug"] {
        opensearch {
          hosts => ["https://opensearch-cluster-master:9200"]
          user => "logstash"
          password => "logstash"
          ssl => true
          ssl_certificate_verification => false
          index => "logstash-unknown-local"
        }   
      }
    }
    


logstashJavaOpts: "-Xmx3g -Xms3g"

resources:
  requests:
    cpu: "100m"
    memory: "4096Mi"
  limits:
    cpu: "1000m"
    memory: "4096Mi"

httpPort: 9600
extraPorts:
  - name: httplog
    containerPort: 8080
  - name: tcp
    containerPort: 5044
  - name: syslog-tcp
    containerPort: 5045
    protocol: TCP
  - name: syslog-udp
    containerPort: 5045
    protocol: UDP
  - name: vault-st-local
    containerPort: 5064
  - name: vault-st-dev
    containerPort: 5065

  - name: debug-tcp
    containerPort: 5077
    protocol: TCP
  - name: debug-udp
    containerPort: 5077
    protocol: UDP

service:
  type: NodePort
  ports:
  - name: httplog
    port: 8080
    nodePort: 31055
    protocol: TCP
    targetPort: httplog
  - name: tcp
    nodePort: 30504
    port: 5044
    protocol: TCP
    targetPort: tcp
  - name: syslog-tcp
    nodePort: 30505
    port: 5045
    protocol: TCP
    targetPort: syslog-tcp
  - name: syslog-udp
    nodePort: 30505
    port: 5045
    protocol: UDP
    targetPort: syslog-udp
  - name: vault-st-local
    nodePort: 30064
    port: 5064
    protocol: TCP
    targetPort: vault-st-local
  - name: vault-st-dev
    nodePort: 30065
    port: 5065
    protocol: TCP
    targetPort: vault-st-dev

  - name: debug-tcp
    nodePort: 30077
    port: 5077
    protocol: TCP
    targetPort: debug-tcp
  - name: debug-udp
    nodePort: 30077
    port: 5077
    protocol: UDP
    targetPort: debug-udp

nodeSelector: 
  nexops-tools: "yes"