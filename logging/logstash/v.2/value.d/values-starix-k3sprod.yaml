logstashConfig:
  logstash.yml: |
    http.host: "0.0.0.0"

logstashPipeline:
  logstash.conf: |
    input {
      tcp {
        port => 5044
      }

      tcp {
        port => 5064
        tags => ["tcp", "vault", "prod", "starix"]
      }

      # http {
      #   port => 8080
      #   add_field => { "[@metadata][input-http]" => "" }
      # }
      # beats {
      #   port => 5000
      # }

    }

  vault_filter.conf: |
    filter {
      if "vault" in [tags] {
        json {
          source => "message"
        }
        mutate {
          remove_field => ["[event][original]"]
          remove_field => ["[response][data]"]
        }
      }
    }

  main_output.conf: |
    output {

      if "vault" in [tags] and "prod" in [tags] and "starix" in [tags] {
        elasticsearch {
          hosts => ["http://10.99.27.15:9200"]
          user => "logstash"
          password => "logstash"
          index => "logstash-vault-starix-prod-%{+YYYY.MM.dd}"
        }         
      }

      else {
        elasticsearch {
          hosts => ["http://10.99.27.15:9200"]
          user => "logstash"
          password => "logstash"
          index => "unknown-%{[@metadata][beat]}-%{+YYYY.MM.dd}"
          ecs_compatibility => disabled
        }        
      }

    }
    


logstashJavaOpts: "-Xmx3g -Xms3g"

resources:
  requests:
    cpu: "100m"
    memory: "4096Mi"
  limits:
    cpu: "1000m"
    memory: "4096Mi"



httpPort: 9600
extraPorts:
  - name: tcp
    containerPort: 5044
  - name: vault-st-prod
    containerPort: 5064


service:
  type: NodePort
  ports:
  - name: tcp
    nodePort: 30504
    port: 5044
    protocol: TCP
    targetPort: 5044
  - name: vault-st-prod
    nodePort: 30064
    port: 5064
    protocol: TCP
    targetPort: 5064