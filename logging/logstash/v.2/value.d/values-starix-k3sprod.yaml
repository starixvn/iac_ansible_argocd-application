replicas: 2

logstashConfig:
  logstash.yml: |
    http.host: "0.0.0.0"

logstashPipeline:
  logstash.conf: |
    input {
      tcp {
        port => 5044
      }
      syslog {
        port => 5045
        type => "syslog"
        tags => ["prod"]
      }
      tcp {
        port => 5064
        type => "vault"
        tags => ["prod", "starix"]
      }
    }

  vault_filter.conf: |
    filter {
      if [type] == "vault" {
        json {
          source => "message"
        }
        mutate {
          rename => {
            "[type]" => "[event_type]"
            "[response][data][error]" => "[response_error]"
          }
          remove_field => ["[event][original]","[response][data]"]
          add_field => {"type" => "vault"}
        }
      }
    }

  syslog_filter.conf: |
    filter {
      if [type] == "syslog" {
        if [program] == "haproxy" {
          if [facility_label] == "local1" {
            mutate {
              add_tag => ["haproxy_access", "hap-ing", "devops"]
            }
          } 
          else if [facility_label] == "local2" {
            mutate {
              add_tag => ["haproxy_access", "hap-gw"]
            }
          }
          else if [facility_label] == "local5" {
            mutate {
              add_tag => ["haproxy_access", "hap-ing", "s1"]
            }
          }
          else {
            mutate {
              add_tag => ["haproxy_access"]
            }
          }
        }
      }

      if "haproxy_access" in [tags] {
        grok {
          match => ["message","%{HAPROXYHTTPBASE}","message","%{HAPROXYHTTP}","message","%{HAPROXYTCP}"]
        }
        grok {
          match => ["message", "%{HAPROXYDATE:accept_date}"]
        }
        grok {
          match => {"captured_request_headers" => "%{DATA:request_host}\|%{DATA:user-agent}\|(%{DATA:request_referer}\|%{IP:TrueClientIP})"}
        }
        mutate {
          remove_field => ["captured_response_cookie","haproxy_time","haproxy_month","haproxy_hour","srvconn","backend_queue","retries","termination_state"]
          remove_field => ["haproxy_monthday","time_backend_connect","pid","srv_queue","beat","beconn","client_port","haproxy_milliseconds","@version"]
          remove_field => ["haproxy_minute","offset","haproxy_second","actconn","source","program","haproxy_year","feconn","http_version"]
          remove_field => ["prospector","time_duration","time_queue","syslog_timestamp","captured_request_cookie","timestamp8601"]
          convert => {
            "http_status_code" => "integer"
            "time_backend_response" => "integer"
          }
        }
        date {match => ["accept_date", "dd/MMM/yyyy:HH:mm:ss.SSS"]}
        geoip {source => "TrueClientIP"}

        if "hap-gw" in [tags] {
        }
        else if "hap-ing" in [tags] {
          if [http_status_code] == 200 and  [time_backend_response] < 5000 { drop {} }
          else if [backend_name] == "stats" { drop {} }
        }
      }
    }

  vault_output.conf: |
    output {
      if [type] == "vault" {
        if "prod" in [tags] and "starix" in [tags] {
          opensearch {
            hosts => ["https://opensearch-cluster-master:9200"]
            user => "logstash"
            password => "logstash"
            ssl => true
            ssl_certificate_verification => false
            index => "logstash-vault-starix-prod-%{+YYYY.MM.dd}"
          }        
        }
        else {
          opensearch {
            hosts => ["https://opensearch-cluster-master:9200"]
            user => "logstash"
            password => "logstash"
            ssl => true
            ssl_certificate_verification => false
            index => "logstash-vault-unknown-%{+YYYY.MM.dd}"
          }       
        }
      }
    }

  syslog_output.conf: |
    output {
      if [type] == "syslog" {
        if "hap-gw" in [tags] {
          opensearch {
            hosts => ["https://opensearch-cluster-master:9200"]
            user => "logstash"
            password => "logstash"
            ssl => true
            ssl_certificate_verification => false
            index => "logstash-haproxy-gw-prod-%{+YYYY.MM.dd}"
          }         
        }
        else if "hap-ing" in [tags] {
          if "devops" in [tags] and "prod" in [tags] {
            opensearch {
              hosts => ["https://opensearch-cluster-master:9200"]
              user => "logstash"
              password => "logstash"
              ssl => true
              ssl_certificate_verification => false
              index => "logstash-haproxy-devops-prod-%{+YYYY.MM.dd}"
            }
          }
          else if "s1" in [tags] and "prod" in [tags] {
            opensearch {
              hosts => ["https://opensearch-cluster-master:9200"]
              user => "logstash"
              password => "logstash"
              ssl => true
              ssl_certificate_verification => false
              index => "logstash-haproxy-s1-prod-%{+YYYY.MM.dd}"
            }
          }
          else {
            opensearch {
              hosts => ["https://opensearch-cluster-master:9200"]
              user => "logstash"
              password => "logstash"
              ssl => true
              ssl_certificate_verification => false
              index => "logstash-haproxy-prod-unknown-%{+YYYY.MM.dd}"
            }         
          }
        }
      }
    }

  main_output.conf: |
    output {
      if [type] not in ["http", "tcp", "syslog", "vault"] {
        opensearch {
          hosts => ["https://opensearch-cluster-master:9200"]
          user => "logstash"
          password => "logstash"
          ssl => true
          ssl_certificate_verification => false
          index => "logstash-unknown-%{+YYYY.MM.dd}"
        }   
      }
    }
    


logstashJavaOpts: "-Xmx3g -Xms3g"

resources:
  requests:
    cpu: "100m"
    memory: "4096Mi"
  limits:
    cpu: "1000m"
    memory: "4096Mi"



httpPort: 9600
extraPorts:
  - name: tcp
    containerPort: 5044
  - name: syslog-tcp
    containerPort: 5045
    protocol: TCP
  - name: syslog-udp
    containerPort: 5045
    protocol: UDP
  - name: vault-st-prod
    containerPort: 5064

service:
  type: NodePort
  ports:
  - name: tcp
    nodePort: 30504
    port: 5044
    protocol: TCP
    targetPort: tcp
  - name: syslog-tcp
    nodePort: 30045
    port: 5045
    protocol: TCP
    targetPort: syslog-tcp
  - name: syslog-udp
    nodePort: 30045
    port: 5045
    protocol: UDP
    targetPort: syslog-udp
  - name: vault-st-prod
    nodePort: 30064
    port: 5064
    protocol: TCP
    targetPort: vault-st-prod
