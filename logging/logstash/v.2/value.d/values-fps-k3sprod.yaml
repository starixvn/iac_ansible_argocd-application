replicas: 2

logstashConfig:
  logstash.yml: |
    http.host: "0.0.0.0"

logstashPipeline:
  logstash.conf: |
    input {
      http {
        port => 8080
        type => "dev-logs"
        tags => ["http"]
        add_field => { "[@metadata][input-http]" => "" }
      }
      tcp {
        port => 5044
        type => "dev-logs"
        tags => ["tcp"]
      }
    }

  dev_filter.conf: |
    filter {
      if [type] == "dev-logs" {
        if "LoginTransaction" in [Tags] {
          useragent {
            source => '[Message][UserAgent]'
            target => "user_agent"
          }
          geoip {
            source => "[Message][IP]"
            target => "geo"
          }
        }
      }
    }

  dev_output.conf: |
    output {
      if [type] == "dev-logs" {
        if "LoginTransaction" in [Tags] {
          opensearch {
            hosts => ["https://fps-cluster:9200"]
            user => "logstash"
            password => "logstash"
            ssl => true
            ssl_certificate_verification => false
            index => "logstash-wabisabi-login-trans-local-%{+YYYY.MM.dd}"
          }      
        }
        else {
          opensearch {
            hosts => ["https://fps-cluster:9200"]
            user => "logstash"
            password => "logstash"
            ssl => true
            ssl_certificate_verification => false
            index => "logstash-dev-unknown-%{+YYYY.MM.dd}"
          } 
        }
      }
    }


  main_output.conf: |
    output {
      if [type] not in ["http", "tcp", "dev-logs"] {
        opensearch {
          hosts => ["https://vn-st-ing-prod.nebula.prod:31920"]
          user => "logstash"
          password => "logstash"
          ssl => true
          ssl_certificate_verification => false
          index => "logstash-uat-unknown-%{+YYYY.MM.dd}"
        }   
      }
    }
    

extraEnvs:
- name: LS_JAVA_OPTS
  value: -Xmx6G -Xms6G -Dhttp.proxyHost=lisasqd.nebula.prod -Dhttp.proxyPort=8801 -Dhttps.proxyHost=lisasqd.nebula.prod -Dhttps.proxyPort=8801
logstashJavaOpts: "-Xmx6g -Xms6g"

resources:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    cpu: "4"
    memory: "4Gi"



httpPort: 9600
extraPorts:
  - name: httplog
    containerPort: 8080
  - name: tcp
    containerPort: 5044

service:
  type: LoadBalancer
  loadBalancerIP: "10.99.185.213"
  ports:
  - name: httplog
    port: 8080
    protocol: TCP
    targetPort: httplog
  - name: tcp
    port: 5044
    protocol: TCP
    targetPort: tcp

nodeSelector:
  node-role.kubernetes.io/ops: ""
tolerations:
- key: "node.role"
  value: "ops"
  operator: Equal
  effect: NoSchedule