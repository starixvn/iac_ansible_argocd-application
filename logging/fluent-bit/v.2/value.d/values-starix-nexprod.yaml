config:
  service: |
    [SERVICE]
        Daemon Off
        Flush {{ .Values.flush }}
        Log_Level {{ .Values.logLevel }}
        Parsers_File /fluent-bit/etc/parsers.conf
        Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port {{ .Values.metricsPort }}
        Health_Check On
        storage.path /var/fluent-bit/state/flb-storage/
        storage.sync normal
        storage.checksum off
        storage.backlog.mem_limit 5M

  ## https://docs.fluentbit.io/manual/pipeline/inputs
  inputs: |
    ## Collect container logs for Nexops Team
    [INPUT]
        Name tail
        Path /var/log/containers/argocd-*.log, /var/log/containers/longhorn-*.log
        multiline.parser docker, cri
        Tag kube.container.nexops.*
        DB /var/fluent-bit/state/flb_container.db
        Mem_Buf_Limit 5MB
        Skip_Long_Lines On
        Refresh_Interval 10
        Rotate_Wait 30
        storage.type filesystem
        Read_from_Head False

    # [INPUT]
    #     Name tail
    #     Path /var/log/containers/*.log
    #     multiline.parser docker, cri
    #     Tag kube.*
    #     Mem_Buf_Limit 5MB
    #     Skip_Long_Lines On

    [INPUT]
        Name systemd
        Tag host.*
        Systemd_Filter _SYSTEMD_UNIT=kubelet.service
        Read_From_Tail On

  ## https://docs.fluentbit.io/manual/pipeline/filters
  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Kube_URL https://kubernetes.default.svc:443
        tls.verify Off
        Merge_Log On
        Merge_Log_Key exts
        Keep_Log On
        K8S-Logging.Parser On
        K8S-Logging.Exclude On
        Labels On
        Annotations Off
        Use_Kubelet On
        Kubelet_Port 10248
        Use_Tag_For_Meta On
        Buffer_Size 0

    [FILTER]
        Name                lua
        Match               kube.*
        code                function strip_ansi_color_code(tag, timestamp, record) if type(record["log"]) == "string" then record["log"] = record["log"]:gsub('[\27\155][][()#;?%d]*[A-PRZcf-ntqry=><~]', '') return 2, 0, record end return 0, 0, 0 end
        call                strip_ansi_color_code

    [FILTER]
        Name                grep
        Match               kube.container.nexops.*
        Exclude             $log level=info
        Exclude             $log \"GET (/[a-zA-Z0-9\-]*)+ HTTP/1.[01]\" 200
        Exclude             $log Found redis master
        Exclude             $log Identifying redis master 
        Exclude             $log using sentinel \(argocd\-redis\-ha\) 

  ## https://docs.fluentbit.io/manual/pipeline/outputs
  outputs: |
    [OUTPUT]
        Name opensearch
        Match kube.container.nexops.*
        Host opensearch-cluster-master
        Port 9200
        HTTP_User logstash
        HTTP_Passwd logstash
        Logstash_Format On
        Retry_Limit False
        Suppress_Type_Name On
        Logstash_Prefix logstash-container-nexops
        Logstash_DateFormat %Y-%m-%d
        Trace_Error On
        Trace_Output On
        Include_Tag_Key On
        tls On
        tls.verify Off
        Tag_Key tagLogKey

  ## https://docs.fluentbit.io/manual/administration/configuring-fluent-bit/classic-mode/upstream-servers
  ## This configuration is deprecated, please use `extraFiles` instead.
  upstream: {}

  ## https://docs.fluentbit.io/manual/pipeline/parsers
  customParsers: |
    [PARSER]
        Name docker_no_time
        Format json
        Time_Keep Off
        Time_Key time
        Time_Format %Y-%m-%dT%H:%M:%S.%L

  # This allows adding more files with arbitrary filenames to /fluent-bit/etc/conf by providing key/value pairs.
  # The key becomes the filename, the value becomes the file content.
  extraFiles: {}