tolerations: 
- effect: NoSchedule
  key: cattle.io/os
  operator: Equal
  value: linux
affinity: 
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: node-role.kubernetes.io/runner
          operator: DoesNotExist
        - key: node-role.kubernetes.io/storage
          operator: DoesNotExist

config:
  service: |
    [SERVICE]
      Daemon Off
      Flush {{ .Values.flush }}
      Log_Level {{ .Values.logLevel }}
      Parsers_File /fluent-bit/etc/parsers.conf
      Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
      HTTP_Server On
      HTTP_Listen 0.0.0.0
      HTTP_Port {{ .Values.metricsPort }}
      Health_Check On
      storage.path /var/fluent-bit/state/flb-storage/
      storage.sync normal
      storage.checksum off
      storage.backlog.mem_limit 5M

  ## https://docs.fluentbit.io/manual/pipeline/inputs
  inputs: |

    # Application log for SC LOCAL (fbit-container-sclocal)
    [INPUT]
      Name tail
      Path /var/log/containers/l1-*.log, /var/log/containers/l2-*.log, /var/log/containers/gn-*.log
      multiline.parser docker, cri
      Tag kube.app.*
      DB /var/fluent-bit/state/flb_container.db
      Mem_Buf_Limit 5MB
      Skip_Long_Lines On
      Refresh_Interval 10
      Rotate_Wait 30
      storage.type filesystem
      Read_from_Head False

    # K8S kube-system log SC LOCAL (fbit-kubesys-sclocal)
    [INPUT]
      Name systemd
      Tag systemd.kube.*
      Systemd_Filter _SYSTEMD_UNIT=kubelet.service
      Systemd_Filter _SYSTEMD_UNIT=containerd.service
      DB /var/fluent-bit/state/systemd.db
      Read_From_Tail On

    # K8S kube-system log SC LOCAL (fbit-kubesys-sclocal)
    [INPUT]
      Name tail
      Tag kube.sys.*
      Path /var/log/containers/kube-*
      multiline.parser docker, cri
      DB /var/fluent-bit/state/flb_kubesys_tail.db
      Mem_Buf_Limit 50MB
      Skip_Long_Lines On
      Refresh_Interval 10
      Rotate_Wait 30
      storage.type filesystem
      Read_from_Head False

  ## https://docs.fluentbit.io/manual/pipeline/filters
  filters: |
    [FILTER]
      Name kubernetes
      Match kube.*
      Kube_URL https://kubernetes.default.svc.testlab.local:443
      tls.verify Off
      Merge_Log On
      Merge_Log_Key exts
      Keep_Log On
      K8S-Logging.Parser On
      K8S-Logging.Exclude On
      Labels On
      Annotations Off
      Use_Kubelet On
      Kubelet_Port 10248
      Use_Tag_For_Meta On
      Buffer_Size 0

    [FILTER]
      Name lua
      Match kube.*
      code function strip_ansi_color_code(tag, timestamp, record) if type(record["log"]) == "string" then record["log"] = record["log"]:gsub('[\27\155][][()#;?%d]*[A-PRZcf-ntqry=><~]', '') return 2, 0, record end return 0, 0, 0 end
      call strip_ansi_color_code

    [FILTER]
      Name grep
      Match kube.app.*
      Exclude $log \"statusCode\":200
      Exclude $log \"GET (/[a-zA-Z\-]*)+ HTTP/1.[01]\" 200
      Exclude $log GET (/[a-zA-Z\-]*)+ 200
      Exclude $log HTTP (response|request) headers after [0-9]+.[0-9]+ms - 200

    [FILTER]
      Name grep
      Match (systemd\.kube|kube\.sys).*
      Exclude $message  level=info
      Exclude $message  "RemoveContainer"


  ## https://docs.fluentbit.io/manual/pipeline/outputs
  outputs: |

    [OUTPUT]
      Name opensearch
      Match kube.app.*
      Host 10.10.50.121
      Port 30920
      HTTP_User fbit
      HTTP_Passwd uJ4R33WzgJwLJgtr1LfK
      Logstash_Format On
      Retry_Limit False
      Suppress_Type_Name On
      Logstash_Prefix fbit-container-sclocal
      Logstash_DateFormat %Y.%m.%d
      Trace_Error On
      Trace_Output On
      Include_Tag_Key On
      tls On
      tls.verify Off
      Tag_Key tagLogKey

    [OUTPUT]
      Name opensearch
      Match_regex (systemd\.kube|kube\.sys).*
      Host 10.10.50.121
      Port 30920
      HTTP_User fbit
      HTTP_Passwd uJ4R33WzgJwLJgtr1LfK
      Logstash_Format On
      Retry_Limit False
      Suppress_Type_Name On
      Logstash_Prefix fbit-kubesys-sclocal
      Logstash_DateFormat %Y.%m.%d
      Trace_Error On
      Trace_Output On
      Include_Tag_Key On
      tls On
      tls.verify Off
      Tag_Key tagLogKey

    # [OUTPUT]
    #     Name es
    #     Match host.*
    #     Host elasticsearch-master
    #     Logstash_Format On
    #     Logstash_Prefix node
    #     Retry_Limit False

  ## https://docs.fluentbit.io/manual/administration/configuring-fluent-bit/classic-mode/upstream-servers
  ## This configuration is deprecated, please use `extraFiles` instead.
  upstream: {}

  ## https://docs.fluentbit.io/manual/pipeline/parsers
  customParsers: |
    [PARSER]
      Name docker_no_time
      Format json
      Time_Keep Off
      Time_Key time
      Time_Format %Y-%m-%dT%H:%M:%S.%L

  # This allows adding more files with arbitrary filenames to /fluent-bit/etc/conf by providing key/value pairs.
  # The key becomes the filename, the value becomes the file content.
  extraFiles: {}