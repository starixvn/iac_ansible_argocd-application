---
opensearchCluster:
  enabled: true

  general:
    httpPort: "9200"
    version: 2.17.1
    serviceName: "fps-cluster"
    drainDataNodes: false
    monitoring:
      enable: true
      scrapeInterval: 30s

  dashboards:
    enable: true
    replicas: 1
    version: 2.17.1
    opensearchCredentialsSecret: 
      name: ops-dashboard-creds
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "4Gi"
        cpu: "4"
    additionalConfig:
      opensearch.hosts: "['https://fps-cluster:9200']"
      opensearchDashboards.index: ".kibana"
      opensearch_security.multitenancy.enabled: "true"
      opensearch_security.readonly_mode.roles: "[kibana_read_only]"
      opensearch.requestHeadersWhitelist: "[authorization, securitytenant]"


  nodePools:
  - component: masters
    diskSize: "30Gi"
    replicas: 3
    jvm: "-Xmx6G -Xms6G -Dhttp.proxyHost=lisasqd.nebula.prod -Dhttp.proxyPort=8801 -Dhttps.proxyHost=lisasqd.nebula.prod -Dhttps.proxyPort=8801"
    roles:
      - "master"
      - "ingest"
    persistence:
      pvc:
        storageClass: longhorn
        accessModes:
        - ReadWriteOnce

    resources: {}
      # requests:
      #   memory: "2Gi"
      #   cpu: "500m"
      # limits:
      #   memory: "2Gi"
      #   cpu: "500m"
    nodeSelector:
      ops-master: "yes"
    tolerations:
    - key: "node.role"
      value: "ops"
      operator: Equal
      effect: NoSchedule
      
  - component: nodes-hot
    diskSize: "800Gi"
    replicas: 2
    jvm: "-Xmx16G -Xms16G -Dhttp.proxyHost=lisasqd.nebula.prod -Dhttp.proxyPort=8801 -Dhttps.proxyHost=lisasqd.nebula.prod -Dhttps.proxyPort=8801"
    roles:
      - "data"
    additionalConfig:
      node.attr.temp: hot
    persistence:
      pvc:
        storageClass: local-storage
        accessModes:
        - ReadWriteOnce

    resources: {}
    nodeSelector:
      node-role.kubernetes.io/ops: ""
    tolerations:
    - key: "node.role"
      value: "ops"
      operator: Equal
      effect: NoSchedule

  - component: nodes-cold
    diskSize: "5800Gi"
    replicas: 1
    jvm: "-Xmx4G -Xms4G -Dhttp.proxyHost=lisasqd.nebula.prod -Dhttp.proxyPort=8801 -Dhttps.proxyHost=lisasqd.nebula.prod -Dhttps.proxyPort=8801"
    roles:
      - "data"
    additionalConfig:
      node.attr.temp: cold
    persistence:
      pvc:
        storageClass: local-storage
        accessModes:
        - ReadWriteOnce

    resources: {}
    nodeSelector:
      node-role.kubernetes.io/ops: ""
    tolerations:
    - key: "node.role"
      value: "ops"
      operator: Equal
      effect: NoSchedule


  security:
    config:
      adminCredentialsSecret:
        name: ops-admin-creds
      ## Warning: Using securityConfigSecret will overwrite data being created directly in opensearch dashboard 
      # securityConfigSecret:
      #   name: ops-securityconfig
    tls:
      transport:
        generate: true
      http:
        generate: true
