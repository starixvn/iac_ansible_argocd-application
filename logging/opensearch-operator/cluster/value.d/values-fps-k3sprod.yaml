---
opensearchCluster:
  enabled: true

  general:
    httpPort: "9200"
    version: 2.17.1
    serviceName: "fps-cluster"
    drainDataNodes: false
    monitoring:
      enable: true
      scrapeInterval: 30s

  dashboards:
    enable: true
    replicas: 1
    version: 2.17.1
    opensearchCredentialsSecret: 
      name: ops-admin-creds
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "4Gi"
        cpu: "4"
    additionalConfig:
      opensearch_security.multitenancy.enabled: "true"
      opensearch_security.multitenancy.tenants.preferred: "[Private, Global]"
      opensearch_security.readonly_mode.roles: "[kibana_read_only]"
      opensearch_security.cookie.secure: "false"


  nodePools:
  - component: masters
    diskSize: "30Gi"
    replicas: 3
    jvm: "-Xmx4G -Xms4G"
    roles:
      - "master"
      - "ingest"
    persistence:
      pvc:
        storageClass: longhorn
        accessModes:
        - ReadWriteOnce
    env:
    - name: OPENSEARCH_JAVA_OPTS
      value: -Xmx4G -Xms4G -Dopensearch.transport.cname_in_publish_address=true -Dhttp.proxyHost=lisasqd.nebula.prod -Dhttp.proxyPort=8801 -Dhttps.proxyHost=lisasqd.nebula.prod -Dhttps.proxyPort=8801

    resources: {}
      # requests:
      #   memory: "2Gi"
      #   cpu: "500m"
      # limits:
      #   memory: "2Gi"
      #   cpu: "500m"
    nodeSelector:
      node-role.kubernetes.io/ops: ""
    tolerations:
    - key: "node.role"
      value: "ops"
      operator: Equal
      effect: NoSchedule
      
  - component: nodes-hot
    diskSize: "800Gi"
    replicas: 2
    jvm: "-Xmx4G -Xms4G"
    roles:
      - "data"
    additionalConfig:
      node.attr.temp: hot
    persistence:
      pvc:
        storageClass: local-storage
        accessModes:
        - ReadWriteOnce
    env:
    - name: OPENSEARCH_JAVA_OPTS
      value: -Xmx4G -Xms4G -Dopensearch.transport.cname_in_publish_address=true -Dhttp.proxyHost=lisasqd.nebula.prod -Dhttp.proxyPort=8801 -Dhttps.proxyHost=lisasqd.nebula.prod -Dhttps.proxyPort=8801

    resources: {}
    nodeSelector:
      node-role.kubernetes.io/ops: ""
    tolerations:
    - key: "node.role"
      value: "ops"
      operator: Equal
      effect: NoSchedule


  security:
    config:
      adminCredentialsSecret:
        name: ops-admin-creds
      securityConfigSecret:
        name: ops-securityconfig
    tls:
      transport:
        generate: true
      http:
        generate: true
