---
image:
  repository: "nexhub.nebula.prod/kbt/base/opensearchproject/opensearch"
  tag: "2.19.2"

singleNode: true

extraEnvs:
- name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
  value: Y8cY3sn7hCwSmJLff2U7fkNG

opensearchJavaOpts: "-Xmx8G -Xms6G -Dhttp.proxyHost=lisasqd.nebula.prod -Dhttp.proxyPort=8801 -Dhttps.proxyHost=lisasqd.nebula.prod -Dhttps.proxyPort=8801"

persistence:
  storageClass: longhorn
  size: 180Gi

ingress:
  enabled: false
  hosts:
    - chart-example.local

# service:
#   type: NodePort
#   nodePort: "31920"

resources:
  requests:
    cpu: "4"
    memory: "8Gi"

serviceMonitor:
  enabled: true
  scheme: https
  internal: 30s
  tlsConfig:
    insecureSkipVerify: true
  basicAuth:
    enabled: true
    existingSecret: opensearch-cluster-master-service-monitor-credentials
