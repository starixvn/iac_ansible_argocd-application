---
secrets:
  name: nexops-env-configuration
  accessKey: nexops
  secretKey: Ilu@n3xc3lS1

tenant:
  name: s1

  configuration:
    name: nexops-env-configuration

  buckets:
  - name: s1-files
  - name: s1-ailab
  - name: s1-nova88
  - name: s1-goal123
  - name: s1-bwing
  - name: s1-tuk555

  users: [ ]

  features:
    bucketDNS: false
    domains: { }
    enableSFTP: false

  pools:
  - name: pool-0
    servers: 2
    volumesPerServer: 2
    size: 10Gi
    storageClassName: longhorn-single
    storageAnnotations: { }
    annotations: { }
    tolerations: [ ]
    nodeSelector: { }
    affinity: { }

  mountPath: /minio

  metrics:
    enabled: true
    port: 80
    protocol: http
  prometheusOperator: true

  certificate:
    requestAutoCert: false

  env:
  - name: MINIO_PROMETHEUS_URL
    value: "http://prometheus-k3slocal-kube-p-prometheus.monitoring.svc:9090"
  - name: MINIO_PROMETHEUS_AUTH_TYPE
    value: "public"
  
  ###
  # PriorityClassName indicates the Pod priority and hence importance of a Pod relative to other Pods.
  # This is applied to MinIO pods only.
  # Refer Kubernetes documentation for details https://kubernetes.io/docs/concepts/configuration/pod-priority-preemption/#priorityclass/
  priorityClassName: ""

ingress:
  api:
    enabled: true
    ingressClassName: "haproxy"
    annotations:
      haproxy.org/ssl-redirect: "false"
    hosts:
    - host: "minio-api.lumigame.com"
      paths: []
    - host: "minio-api.lumiplus.vn"
      paths: []
    tls:
    - hosts:
      - minio-api.lumigame.com
    pathType: Prefix
  console:
    enabled: false
    ingressClassName: "haproxy"
    hosts:
    - host: ""
      paths: []
    pathType: Prefix