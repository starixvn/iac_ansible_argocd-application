---
tenant:
  name: nexops
  configuration:
    name: myminio-env-configuration
  configSecret:
    name: myminio-env-configuration
    accessKey: nexops
    secretKey: Ilu@n3xc3l12


  pools:
  - servers: 2
    name: pool-0
    volumesPerServer: 2
    size: 120Gi
    storageClassName: directpv-min-io
    # tolerations:
    # - key: node.role
    #   operator: "Equal"
    #   value: minio
    #   effect: "NoSchedule"
    nodeSelector:
      node-role.kubernetes.io/minio: "yes"

  metrics:
    enabled: true
    port: 9000
    protocol: http

  certificate:
    requestAutoCert: false

  features:
    bucketDNS: false
    domains: { }
    enableSFTP: false

  buckets: [ ]
  users: [ ]

  prometheusOperator: true

  env:
  - name: MINIO_PROMETHEUS_URL
    value: "http://prometheus-backup-kube-pro-prometheus.monitoring.svc:9090"


ingress:
  api:
    enabled: true
    ingressClassName: "haproxy"
    annotations:
      haproxy.org/ssl-redirect: "false"
    tls: [ ]
    hosts:
    - host: "s3-api.nexdev.net"
      paths: []
    - host: "s3-api.starixsoft.com"   # API-access from KBT
      paths: []
    - host: "s3-api.lumigame.com"     # API-access for git3
      paths: []
    tls:
    - hosts:
      - minio-api.starixsoft.com
      - s3-api.nexdev.net
    pathType: Prefix
  console:
    enabled: true
    ingressClassName: "haproxy"
    annotations:
      haproxy.org/ssl-redirect: "false"
    tls: [ ]
    hosts:
    - host: "s3.nexdev.net"
      paths: []
    pathType: Prefix
