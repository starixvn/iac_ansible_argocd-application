---
tenant:
  configuration:
    name: nexops-env-configuration
  configSecret:
    name: nexops-env-configuration
    accessKey: nexops
    secretKey: Ilu@n3xc3l12

  buckets: []
  # - name: sc-stream
  users: [ ]

  features:
    bucketDNS: false
    domains: { }
    enableSFTP: false

  pools:
  - name: pool-0
    servers: 2
    volumesPerServer: 2
    size: 5Gi
    storageClassName: longhorn-stricted
    storageAnnotations: { }
    annotations: { }
    tolerations: [ ]
    nodeSelector:
      node-longhorn-strict: "yes"
    affinity: { }

  mountPath: /minio

  metrics:
    enabled: true
    port: 80
    protocol: http
  prometheusOperator: false

  certificate:
    requestAutoCert: false

  env:
  - name: MINIO_PROMETHEUS_URL
    value: "http://prometheus-stack-kube-prom-prometheus.monitoring.svc:9090"
  - name: MINIO_PROMETHEUS_AUTH_TYPE
    value: "public"
  
  ###
  # PriorityClassName indicates the Pod priority and hence importance of a Pod relative to other Pods.
  # This is applied to MinIO pods only.
  # Refer Kubernetes documentation for details https://kubernetes.io/docs/concepts/configuration/pod-priority-preemption/#priorityclass/
  priorityClassName: ""

ingress:
  api:
    enabled: true
    ingressClassName: "haproxy"
    hosts:
    - host: "minio.lumigame.com"
      paths: []
    pathType: Prefix
  console:
    enabled: true
    ingressClassName: "haproxy"
    hosts:
    - host: "minio-console.lumigame.com"
      paths: []
    pathType: Prefix