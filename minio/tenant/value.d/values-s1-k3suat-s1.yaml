---
tenant:
  name: s1
  configuration:
    name: nexops-env-configuration
  configSecret:
    name: nexops-env-configuration
    accessKey: nexops
    secretKey: Ilu@n3xc3lS1

  buckets: []
  # buckets:
  # - name: s1-banner
  # - name: s1-backoffice
  # - name: s1-bannerimgs
  # - name: s1-config
  # - name: s1-errorpage
  # - name: s1-payment
  # - name: s1-gameimgs
  # - name: s1-sportsimgs

  users: [ ]

  features:
    bucketDNS: false
    domains: { }
    enableSFTP: false

  pools:
  - name: pool-0
    servers: 2
    volumesPerServer: 2
    size: 10Gi
    storageClassName: longhorn-s1-single
    storageAnnotations: { }
    annotations: { }
    tolerations: [ ]
    # - key: cattle.io/os
    #   operator: "Equal"
    #   value: minio
    #   effect: "NoSchedule"
    nodeSelector: { }
      # node-role.kubernetes.io/minio: "yes"
    affinity: { }

  metrics:
    enabled: true
    port: 80
    protocol: http
  prometheusOperator: true

  certificate:
    requestAutoCert: false

  env:
  - name: MINIO_PROMETHEUS_URL
    value: "http://prometheus-k3suat-kube-pro-prometheus.monitoring.svc:9090"
  - name: MINIO_PROMETHEUS_AUTH_TYPE
    value: "public"
  
  ###
  # PriorityClassName indicates the Pod priority and hence importance of a Pod relative to other Pods.
  # This is applied to MinIO pods only.
  # Refer Kubernetes documentation for details https://kubernetes.io/docs/concepts/configuration/pod-priority-preemption/#priorityclass/
  priorityClassName: ""

ingress:
  api:
    enabled: true
    ingressClassName: "haproxy"
    annotations:
      haproxy.org/ssl-redirect: "false"
    hosts:
    - host: "vn-s1-minio-api-uat.nebula.prod"
      paths: []
    - host: "minio-api.vgamesuat.com"
      paths: []
    pathType: Prefix
  console:
    enabled: false
    ingressClassName: "haproxy"
    hosts:
    - host: ""
      paths: []
    pathType: Prefix