---
- name: Deploy Application via ArgoCD
  hosts: master[0]
  run_once: true
  tasks:
    - name: Create Directory contain manifest file
      file:
        path: "/tmp/{{pathManifest}}"
        state: directory

    - name: Gen manifest file from JinJa files
      template:
        src: "{{pathManifest}}/application.yml.j2"
        dest: "/tmp/{{pathManifest}}/application.yml"

    # - name: Install Application
    #   k8s:
    #     src: "/tmp/{{pathManifest}}/application.yml"
    #     state: present
    #     apply: true

    - name: Install Application
      kube:
        kubectl: "{{ bin_dir }}/kubectl"
        filename: "/tmp/{{pathManifest}}/application.yml"
        state: latest
        apply: true


    # - name: Install Application
    #   shell: |
    #     k3s kubectl apply -f "/tmp/{{pathManifest}}/application.yml"

    - name: Cleanup Manifests file
      file:
        state: absent
        path: "/tmp/{{pathManifest}}"

