---
controller:
  kind: DaemonSet

  ingressClassResource:
    name: ops-ingress
    default: false
    parameters: {}

  ingressClass: ops-ingress

  config:
    stats-config-snippet: |
      stats auth nexops:NexOps!QAZ
      stats refresh 300s
      stats show-legends
      stats show-node
      stats show-modules
    frontend-config-snippet: |
      capture request header Host len 30
      capture request header User-Agent len 200
      capture request header Referer len 800
      capture request header X-Forwarded-For len 20
    backend-config-snippet: |
      option forwardfor if-none
  
  extraArgs:
  - --disable-ipv6

  service:
    type: LoadBalancer
    externalTrafficPolicy: "Local"
    ipFamilyPolicy: SingleStack
    ipFamilies: [IPv4]
    loadBalancerIP: "10.18.200.195"

    tcpPorts:
    - name: redis-nap-m
      port: 16379
      targetPort: 16379

    # nodePorts:
    #   http: 31080
    #   https: 31443
    #   stat: 31024

  logging:
    level: info
    traffic:
      address: "stdout"
      format: "raw"
      facility: "daemon"

  nodeSelector:
    node-role.kubernetes.io/master: "true"
    node-role.kubernetes.io/control-plane: "true"

  serviceMonitor:
    enabled: true
    extraLabels: {}
    endpoints:
      - port: stat
        path: /metrics
        scheme: http
        interval: 30s

extraResources: {}
