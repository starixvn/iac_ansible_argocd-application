alertmanager:
  config:
    global:
      resolve_timeout: 15m
      slack_api_url: https://hooks.slack.com/services/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
    templates:
    - /etc/alertmanager/config/*.tmpl
      
  templateFiles:
    sre-template.tmpl: |-
      {{ define "sre.slack.title" -}}
        {{- if eq .Status "firing" -}}
          {{- if eq (.CommonLabels.severity | toUpper) "CRITICAL" -}}
            :pepe-rage: [{{ .CommonLabels.severity | toUpper }}] {{ .CommonAnnotations.summary }}
          {{- else if eq (toUpper .CommonLabels.severity) "WARNING" -}}
            :meow-stare: [{{ .CommonLabels.severity | toUpper }}] {{ .CommonAnnotations.summary }}
          {{- else -}} 
            :meow-disputed: [{{ .CommonLabels.severity | toUpper }}] {{ .CommonAnnotations.summary }}
          {{- end -}}
        {{- else -}}
          :pepe-saber: [{{ .CommonLabels.severity | toUpper }} | {{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}
        {{- end -}}
      {{- end }}

      {{ define "sre.slack.body" -}}
        *Description:* {{ .CommonAnnotations.description }}

        *Details:*
        {{- range $key, $value := .CommonLabels -}}
          {{- if or 
            (eq $key "cluster")
            (eq $key "job")
            (eq $key "pod")
            (eq $key "pvc")
          }}
           • *{{ $key | title }}:* `{{ $value }}`
          {{- end -}}
        {{- end -}}
      {{- end }}

      {{ define "sre.slack.fallback" }}
        {{ template "sre.slack.title" . }}
      {{ end }}

      {{ define "sre.slack.color" -}}
        {{- if eq .Status "firing" -}}
          {{- if eq (.CommonLabels.severity | toUpper) "CRITICAL" -}}
            #FF5733
          {{- else if eq (.CommonLabels.severity | toUpper) "WARNING" -}}
            #FFA500
          {{- else -}}
            #4350E0
          {{- end -}}
        {{- else -}}
          #32CD32
        {{- end -}}
      {{- end }}

      {{ define "sre.slack.titlelink" -}}
        {{ range .Alerts }}{{ .Annotations.DashboardURL }}{{ end }} 
      {{- end }}